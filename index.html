/* ---- Rezept-Zugriff und Nährwerte ---- */
const nutCache = new WeakMap();
function recNut(r){
  let c = nutCache.get(r); if (c) return c;
  const t = {k:0,p:0,c:0,f:0}; let est = 0;
  r.ing.forEach(i => { if (i.per100) { const x = scale(i.per100, i.g); t.k+=x.k; t.p+=x.p; t.c+=x.c; t.f+=x.f; if (i.est) est++; } else est++; });
  const s = Math.max(1, r.s);
  c = {k:t.k/s, p:t.p/s, c:t.c/s, f:t.f/s, est, total:r.ing.length};
  nutCache.set(r, c); return c;
}
const allRecipes = () => [...RECIPES, ...D.recipes];
const recById = id => allRecipes().find(r => r.id === id) || ui.aiTemp.find(r => r.id === id) || null;
const defaultServ = r => D.settings.portions > 0 ? D.settings.portions : r.s;
function recTags(r){
  const n = recNut(r), tags = [];
  if (n.p >= 35) tags.push('proteinreich');
  if (r.t <= 20) tags.push('schnell');
  if (r.c === 1) tags.push('günstig');
  if ((r.tags||[]).includes('mealprep') || r.s >= 3) tags.push('Meal-Prep');
  if (!r.ing.some(i => MEAT_RX.test(norm(i.n)))) tags.push('vegetarisch');
  return tags;
}
function dislikeTokens(){ return String(D.settings.dislikes||'').split(/[,;\n]/).map(s => norm(s.trim())).filter(s => s.length > 1); }
function likeTokens(){ return String(D.settings.likes||'').split(/[,;\n]/).map(s => norm(s.trim())).filter(s => s.length > 1); }
function eligible(r){
  const S = D.settings;
  const al = allergensOf(r.ing.map(i => i.n));
  if ((S.allergies||[]).some(a => al.has(a))) return false;
  const names = r.ing.map(i => norm(i.n)).concat(norm(r.n));
  if (dislikeTokens().some(t => names.some(n => n.includes(t)))) return false;
  const needs = r.tools.join(' ');
  if (/Backofen/.test(needs) && !(S.equip||[]).includes('Backofen')) return false;
  if (/Mixer/.test(needs) && !(S.equip||[]).includes('Mixer')) return false;
  if (S.maxTime > 0 && r.t > S.maxTime) return false;
  return true;
}
function likeScore(r){
  const lk = likeTokens(); if (!lk.length) return 0;
  const names = r.ing.map(i => norm(i.n)).concat(norm(r.n));
  return Math.min(2, lk.filter(t => names.some(n => n.includes(t))).length);
}

/* ---- Kühlschrank ---- */
function fridgeFor(name){
  const k = norm(name), base = k.split(',')[0].trim();
  return D.fridge.filter(f => { const fk = norm(f.n); return fk === k || (!fk.includes(',') && fk === base); });
}
const fridgeAmount = name => fridgeFor(name).reduce((a,f) => a + f.g, 0);
function availability(r, servings){
  const fac = servings / r.s, have = [], part = [], miss = [];
  r.ing.forEach(i => {
    const need = i.g * fac, amt = fridgeAmount(i.n);
    if (amt >= need * 0.98) have.push({n:i.n, g:need});
    else if (amt > 0) part.push({n:i.n, g:need - amt, need});
    else miss.push({n:i.n, g:need});
  });
  return {have, part, miss, lacking: part.length + miss.length};
}
function daysLeft(exp){ if (!exp) return null; return Math.round((parseD(exp) - parseD(todayStr())) / 86400000); }

/* ---- Einkaufsliste ---- */
function aggregateNeeds(list){ // [{r, portions}] -> {normName:{n,g}}
  const m = {};
  list.forEach(({r, portions}) => r.ing.forEach(i => {
    const k = norm(i.n); const g = i.g / r.s * portions;
    (m[k] = m[k] || {n:i.n, g:0}).g += g;
  }));
  return m;
}
function subtractFridge(m){
  return Object.values(m).map(x => ({n:x.n, g:Math.max(0, x.g - fridgeAmount(x.n))})).filter(x => x.g >= 1);
}
function addToShop(needs, label){
  let n = 0; D.cartX = D.cartX || [];
  needs.forEach(x => {
    if (!(x.g >= 1)) return;
    D.cartX.push({id:uid(), n:x.n, a:Math.round(x.g), u: LIQ_RX.test(norm(x.n)) && !/quark|kaese/.test(norm(x.n)) ? 'ml' : 'g'}); n++;
  });
  touch(); return n;
}
function costEstimate(items){
  let sum = 0, known = 0;
  items.forEach(i => { const p = D.prices[norm(i.n)]; if (p > 0) { sum += i.g / 1000 * p; known++; } });
  return {sum, known, total: items.length};
}

/* ---- Tagesrest und Empfehlungen ---- */
const SLOT_W = {breakfast:1, lunch:1.3, dinner:1.3, snack:.5};
function remainingFor(date){
  const S = D.settings, T = dayT(date);
  return {k:S.kcal-T.k, p:S.p-T.p, c:S.c-T.c, f:S.f-T.f};
}
function openSlots(date){
  const logged = new Set(entriesOn(date).map(e => e.m));
  let seq = ['breakfast','lunch','dinner','snack'];
  if (date === todayStr()) {
    const d = new Date(), h = d.getHours() + d.getMinutes()/60;
    seq = h < 10.5 ? seq : h < 14.5 ? ['lunch','dinner','snack'] : h < 17 ? ['snack','dinner'] : h < 21.5 ? ['dinner','snack'] : ['snack'];
  }
  const open = seq.filter(s => !logged.has(s));
  return open.length ? open : ['snack'];
}
const nextSlot = date => openSlots(date)[0];
function slotTarget(date){
  const rem = remainingFor(date), open = openSlots(date), slot = open[0];
  const share = SLOT_W[slot] / open.reduce((a,s) => a + SLOT_W[s], 0);
  return {slot, rem, k:Math.max(0, rem.k) * share, p:Math.max(0, rem.p) * share};
}
function pickMult(k, tK, minM=.75){ if (!(k > 0) || !(tK > 0)) return 1; return clamp(Math.round(tK / k * 4) / 4, minM, 1.5); }
function fitScore(nut, mult, tK, tP){
  return Math.abs(nut.k*mult - tK) / Math.max(tK, 250) + .8 * Math.abs(nut.p*mult - tP) / Math.max(tP, 20);
}
function suggest(mode, n=3){
  const date = todayStr(), tg = slotTarget(date), S = D.settings;
  let pool = allRecipes().filter(eligible);
  const fridgeOn = D.fridge.length > 0;
  const scored = pool.map(r => {
    const nut = recNut(r), mult = pickMult(nut.k, tg.k), eff = {k:nut.k*mult, p:nut.p*mult};
    let sc = fitScore(nut, mult, tg.k, tg.p) + (r.m === tg.slot ? 0 : .25) - likeScore(r) * .12;
    if (S.cheap) sc += (Math.max(r.c,1) - 1) * .1;
    const av = availability(r, r.s);
    if (mode === 'protein') { if (tg.rem.k > 0 && eff.k > tg.rem.k + 50) return null; sc = -(eff.p*4 / Math.max(eff.k,1)) * 1.4 + Math.abs(eff.k - tg.k) / Math.max(tg.k, 250) * .5; }
    if (mode === 'quick') { if (r.t > 20 || r.c > 2) return null; sc += r.t / 40; }
    if (mode === 'fridge') { if (!fridgeOn) return null; sc = av.lacking * .6 + sc * .5 - (r.ing.length - av.lacking) / r.ing.length; }
    if (mode === 'prep') { if (!(r.s >= 2 || (r.tags||[]).includes('mealprep')) || r.m === 'breakfast') return null; }
    return {r, mult, eff, sc, av};
  }).filter(Boolean).sort((a,b) => a.sc - b.sc);
  const out = [], seen = new Set();
  for (const x of scored) { if (seen.has(x.r.n)) continue; seen.add(x.r.n); out.push(x); if (out.length >= n) break; }
  return {list: out, tg};
}

const PLAN_SLOTS = ['breakfast','lunch','dinner','snack'];
const MAIN_SHARE = {breakfast:.25, lunch:.34, dinner:.34};
function genPlan(start){
  const S = D.settings, pool = allRecipes().filter(eligible);
  if (!pool.length) return false;
  const days = {}, used = {}, lastBySlot = {}, ingSeen = new Set();
  for (let i = 0; i < 7; i++) {
    const date = addDays(start, i), day = {}; let sumK = 0, sumP = 0;
    PLAN_SLOTS.forEach(slot => {
      const tK = slot === 'snack' ? Math.max(150, S.kcal - sumK) : S.kcal * MAIN_SHARE[slot];
      const tP = slot === 'snack' ? Math.max(10, S.p - sumP) : S.p * MAIN_SHARE[slot];
      let cand = pool.filter(r => slot === 'snack' ? r.m === 'snack' : slot === 'breakfast' ? r.m === 'breakfast' : (r.m === 'lunch' || r.m === 'dinner'));
      if (!cand.length) cand = pool;
      const scored = cand.map(r => {
        const nut = recNut(r), mult = pickMult(nut.k, tK, slot === 'snack' ? .5 : .75);
        let sc = fitScore(nut, mult, tK, tP);
        const u = used[r.id] || 0, prep = r.s >= 3;
        if (prep && u > 0 && u < Math.min(r.s, 3)) sc -= .3; else sc += u * .6;
        if (!prep && lastBySlot[slot] === r.id) sc += .8;
        if (Object.values(day).some(x => x.rid === r.id)) sc += 1;
        if (slot !== 'snack' && slot !== 'breakfast' && r.m !== slot) sc += .1;
        sc -= r.ing.filter(x => ingSeen.has(norm(x.n))).length / r.ing.length * .45;
        sc -= likeScore(r) * .1;
        if (S.cheap) sc += (Math.max(r.c,1) - 1) * .12;
        sc += Math.random() * .15;
        return {r, mult, nut, sc};
      }).sort((a,b) => a.sc - b.sc);
      const pick = scored[0];
      day[slot] = {rid:pick.r.id, mult:pick.mult};
      used[pick.r.id] = (used[pick.r.id] || 0) + 1; lastBySlot[slot] = pick.r.id;
      pick.r.ing.forEach(x => ingSeen.add(norm(x.n)));
      sumK += pick.nut.k * pick.mult; sumP += pick.nut.p * pick.mult;
    });
    days[date] = day;
  }
  // gebrauchte AI-Rezepte dauerhaft sichern
  Object.values(days).forEach(d => Object.values(d).forEach(x => ensureSaved(recById(x.rid))));
  D.plan = {start, days}; touch(); return true;
}
function planDayTotals(date){
  const day = D.plan && D.plan.days[date]; const t = {k:0,p:0,c:0,f:0};
  if (!day) return t;
  PLAN_SLOTS.forEach(s => { const x = day[s]; if (!x) return; const r = recById(x.rid); if (!r) return; const n = recNut(r); t.k += n.k*x.mult; t.p += n.p*x.mult; t.c += n.c*x.mult; t.f += n.f*x.mult; });
  return t;
}
function planUsage(openOnly){
  const use = {};
  if (!D.plan) return use;
  Object.keys(D.plan.days).forEach(d => Object.values(D.plan.days[d]).forEach(x => { if (openOnly && x.done) return; use[x.rid] = (use[x.rid] || 0) + x.mult; }));
  return use;
}
function ensureSaved(r){
  if (!r || r.src !== 'ai') return;
  if (D.recipes.some(x => x.id === r.id)) return;
  D.recipes.push(clone(r));
  if (D.recipes.length > 60) {
    const keep = new Set([...D.favRecipes, ...(D.plan ? Object.values(D.plan.days).flatMap(d => Object.values(d).map(x => x.rid)) : [])]);
    const i = D.recipes.findIndex(x => !keep.has(x.id)); if (i >= 0) D.recipes.splice(i, 1);
  }
}

function recCard(r, o={}){

    <button class="star ${fav?'on':''}" data-act="rcFav" data-id="${esc(r.id)}" aria-label="Favorit">${fav?'★':'☆'}</button></div>`;

function missChips(av){
  const m = [...av.miss, ...av.part];
  if (!m.length) return '<div class="small" style="color:var(--acc);margin-top:6px">Alles im Kühlschrank vorhanden</div>';
  return `<div class="chips" style="margin:6px 0 0">${m.map(x => `<span class="pill warn">fehlt: ${esc(x.n.split(',')[0])} ${f0(x.g)} g</span>`).join('')}</div>`;
}

function filteredRecipes(){
  const f = ui.rf; let hidden = 0;
  const list = allRecipes().filter(r => {
    if (!eligible(r)) { hidden++; return false; }
    const n = recNut(r);
    if (f.meal !== 'all' && r.m !== f.meal) return false;
    if (f.kcal && n.k > f.kcal) return false;
    if (f.prot && n.p < f.prot) return false;
    if (f.time && r.t > f.time) return false;
    if (f.cost && r.c > f.cost) return false;
    if (f.fav && !D.favRecipes.includes(r.id)) return false;
    if (f.q && !norm(r.n + ' ' + r.ing.map(i => i.n).join(' ')).includes(norm(f.q))) return false;
    return true;
  });
  return {list, hidden};
}
function recipeListHTML(){
  const {list, hidden} = filteredRecipes();
  return (list.length ? list.map(r => recCard(r)).join('') : '<div class="empty">Keine Rezepte für diese Filter.</div>')

    <div class="small faint">Der Plan nutzt deine Einstellungen (Allergien, Abneigungen, Zeit, Küchengeräte).</div>`;
  const S = D.settings, usage = planUsage(false);
  let h = `<div class="grid2" style="margin-bottom:12px"><button class="btn sec" data-act="plGen">Neu erzeugen</button><button class="btn" data-act="plShop">Wocheneinkauf</button></div>`;
  const prep = Object.keys(usage).map(id => ({r:recById(id), n:usage[id]})).filter(x => x.r && x.n >= 2).sort((a,b) => b.n - a.n);
  if (prep.length) h += `<div class="card"><h2>Meal-Prep</h2>${prep.map(x => `<div class="row"><div class="r-main"><div class="r-name">${esc(x.r.e)} ${esc(x.r.n)}</div><div class="r-sub">${fm(x.n)} Portionen diese Woche${x.r.s >= 2 ? ` · ein Ansatz ergibt ${x.r.s}` : ''}</div></div></div>`).join('')}<div class="small muted" style="margin-top:8px">Diese Gerichte kochst du am besten in einem Rutsch vor und teilst sie in Boxen auf.</div></div>`;
  const needs = subtractFridge(aggregateNeeds(Object.keys(planUsage(true)).map(id => ({r:recById(id), portions:planUsage(true)[id]})).filter(x => x.r)));
  const ce = costEstimate(needs);
  if (ce.known) h += `<div class="small muted" style="margin-bottom:10px">Geschätzte Kosten offener Mahlzeiten: ca. ${fm(f1(ce.sum))} € (nur ${ce.known} von ${ce.total} Artikeln mit eigenem Preis)${S.budgetDay > 0 ? ` · Budget ${f0(S.budgetDay*7)} € pro Woche` : ''}</div>`;
  for (let i = 0; i < 7; i++) {
    const date = addDays(p.start, i), day = p.days[date] || {}, t = planDayTotals(date);

    h += `<div class="card"><div class="row2"><b style="font-size:17px">${WD_LONG[parseD(date).getDay()]}, ${parseD(date).getDate()}.</b><span class="sp"></span><span class="pill ${ok?'ok':''}">${f0(t.k)} kcal · ${f0(t.p)} g P</span></div>`;
    PLAN_SLOTS.forEach(slot => {
      const x = day[slot], r = x && recById(x.rid);
      if (!r) { h += `<div class="prow"><span class="plslot">${mealName(slot)}</span><button class="pmain" data-act="plSwap" data-d="${date}" data-s="${slot}"><span class="muted">Leer · Gericht wählen</span></button></div>`; return; }
      const n = recNut(r);
      h += `<div class="prow"><span class="plslot">${mealName(slot)}</span><button class="pmain" data-act="plOpen" data-d="${date}" data-s="${slot}"><span class="r-name ${x.done?'done':''}">${esc(r.e)} ${esc(r.n)}</span><span class="r-sub">${x.mult !== 1 ? '×' + fm(x.mult) + ' · ' : ''}${f0(n.k*x.mult)} kcal · ${f0(n.p*x.mult)} g P${r.src==='ai'?' · KI':''}</span></button>
        <button class="x" data-act="plSwap" data-d="${date}" data-s="${slot}" aria-label="Tauschen">⇄</button>${x.done ? '<span class="x" style="background:var(--accSoft);color:var(--acc)">✓</span>' : `<button class="x" data-act="plLog" data-d="${date}" data-s="${slot}" aria-label="Als gegessen speichern">✓</button>`}</div>`;
    });
    h += '</div>';
  }
  return h + `<div class="small faint">„⇄“ ersetzt ein Gericht durch eine Alternative. „✓“ speichert die Mahlzeit im Dashboard.</div>`;
}

function deductFridge(r, serv){
  let n = 0;
  r.ing.forEach(i => {
    let need = i.g * serv / r.s, used = false;
    fridgeFor(i.n).sort((a,b) => String(a.exp || '9').localeCompare(String(b.exp || '9'))).forEach(f => {
      if (need <= 0) return;
      const take = Math.min(f.g, need); f.g = R1(f.g - take); need -= take; used = true;
    });
    if (used) n++;
  });
  D.fridge = D.fridge.filter(f => f.g > 0.5);
  touch(); return n;
}
function logRecipe(r, eat, meal, date){
  const n = recNut(r);
  const t = {k:R1(n.k*eat), p:R1(n.p*eat), c:R1(n.c*eat), f:R1(n.f*eat)};
  ensureSaved(r);
  const e = makeEntry({n: r.n + (eat !== 1 ? ` (${fm(eat)} Port.)` : ''), g:null, per100:null, t, src:'recipe'}, meal, date);
  e.rid = r.id; e.eat = eat;
  if (n.est) e.note = `${n.est} Zutaten mit geschätzten Nährwerten`;
  addEntries([e]);
}

function normAiRecipe(x){
  if (!x || !Array.isArray(x.zutaten)) return null;
  const ing = x.zutaten.map(z => {
    const nm = String(z && z.name || '').trim().slice(0,60); if (!nm) return null;
    const g = Math.round(clamp(num(z.gramm), 1, 3000)), f = foodByName(nm);
    if (f) return {n:f.n, g, per100:clone(f.per100), est:false};
    const per = {k:Math.max(0,num(z.kcal_pro_100g)), p:Math.max(0,num(z.protein_pro_100g)), c:Math.max(0,num(z.kohlenhydrate_pro_100g)), f:Math.max(0,num(z.fett_pro_100g))};
    const mk = macroKcal(per); if (Math.abs(per.k - mk) > Math.max(30, mk*.25)) per.k = Math.round(mk);
    return {n:nm, g, per100:per, est:true};
  }).filter(Boolean);
  const steps = (Array.isArray(x.schritte) ? x.schritte : []).map(s => String(s).slice(0,400)).filter(Boolean);
  if (ing.length < 2 || !steps.length) return null;
  const alt = {}; (Array.isArray(x.alternativen) ? x.alternativen : []).forEach(a => { if (a && a.zutat && a.alternative) alt[String(a.zutat).slice(0,60)] = String(a.alternative).slice(0,120); });

async function aiGenerate(mode){
  if (!aiFn || ui.aiBusy) return;
  ui.aiBusy = true; ui.aiErr = ''; ui.aiNote = ''; ui.aiCtl = new AbortController(); ui.aiMode = mode; render();
  try {
    const res = await aiFn.json(buildRecipePrompt(mode), {signal:ui.aiCtl.signal, modelTier:'default'});
    const all = (Array.isArray(res && res.rezepte) ? res.rezepte : []).map(normAiRecipe).filter(Boolean);
    const ok = all.filter(eligible);
    ui.aiTemp = ok;
    const dropped = all.length - ok.length;
    if (dropped) ui.aiNote = `${dropped} Vorschläge wurden aussortiert (Allergien, Abneigungen, Zeit oder Geräte).`;
    if (!ok.length) ui.aiErr = 'Es kamen keine brauchbaren Rezepte zurück. Versuche es noch einmal.';

    if (c !== 'cancelled') ui.aiErr = c === 'not_granted' ? 'Die KI-Nutzung wurde nicht erlaubt. Die lokalen Vorschläge funktionieren weiter.' : c === 'rate_limited' ? 'Zu viele Anfragen oder dein Kontingent ist erreicht. Versuche es später erneut.' : 'Die KI-Anfrage ist fehlgeschlagen. Versuche es erneut.';

/* importierte Rezepte (D.imported) → gleiche Struktur */
function kcAll(){ return KC.concat(D.imported || []); }
function kcById(id){ return kcAll().find(r => r.id === id) || null; }

/* ---- Nährwerte aus Zutaten (Richtwerte, Rohgewichte) ---- */
const NUTC = new WeakMap();
function kcNut(r){
  const hit = NUTC.get(r); if (hit && hit.s === r.s) return hit.v;
  let k = 0, p = 0, c = 0, f = 0, n = 0, hitN = 0;
  r.ing.forEach(i => {
    const inf = ingInfo(i.n); if (!inf || inf.hide) return;
    if (i.a == null || inf.basic) { if (inf.basic && inf.n === 'Pfeffer') return; return; }
    n++; const g = gramsOf(inf, i.a, i.u);
    if (g == null) return; hitN++;
    k += inf.k * g / 100; p += inf.p * g / 100; c += inf.c * g / 100; f += inf.f * g / 100;
  });
  const s = r.s || 2;
  const v = {k:k/s, p:p/s, c:c/s, f:f/s, cov: n ? hitN / n : 0}; NUTC.set(r, {s:r.s, v}); return v;
}

function buildCart(){

    if (inf && b && !b.odd) { key = norm(inf.n); base = b.base; amt = b.amt; }
    else { base = (b && b.base) || u || 'Stk'; amt = b ? b.amt : a; key = norm(nm) + '|' + base; }
    const L = lines[key] = lines[key] || {key, n:nm, base, amt:0, cat: inf ? inf.cat : catGuess(nm), pack: inf ? inf.pack : 0, lbl: inf ? inf.lbl : '', info:inf, src:[]};
    L.amt += amt; L.src.push({label, amt, extraId});

function catGuess(n){ const s = norm(n);

  if (/fleisch|wurst|schinken|speck|fisch|lachs|huhn|haehn|pute|rind|schwein/.test(s)) return 1;
  if (/milch|kaese|joghurt|quark|sahne|butter|ei$|eier/.test(s)) return 2;
  if (/brot|broetchen|toast|kuchen/.test(s)) return 3;
  if (/nudel|reis|mehl|haferflock|couscous|grieß|griess/.test(s)) return 4;

function recipeFromJsonLd(txt){

  while ((m = rx.exec(txt))) blocks.push(m[1]);

    const t = o['@type']; if (t === 'Recipe' || (Array.isArray(t) && t.includes('Recipe'))) return o; return find(o['@graph']); };
  for (const b of blocks) { try { const r = find(JSON.parse(b.trim())); if (r) return r; } catch (e) {} }
  return null;
}
function buildImported(o, url){

  if (!o.n || !ing.length || !(o.steps || []).length) return null;
  const hostname = (() => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } })();
  return {id:'i' + uid(), kc:true, imp:true, e:'📥', n:String(o.n).slice(0, 90), cats:['Importiert'], t:o.t || 30, d:'mittel', s:o.s || 2, ing, steps:o.steps, tools:[], tip:'', url: url || '', src: hostname ? `Importiert von ${hostname}` : 'Importiert (eigener Text)'};

  if (ld) {
    const steps = []; const walk = x => { if (!x) return; if (typeof x === 'string') steps.push(x.replace(/<[^>]+>/g, '').trim()); else if (Array.isArray(x)) x.forEach(walk); else if (x.text) steps.push(String(x.text).replace(/<[^>]+>/g, '').trim()); else if (x.itemListElement) walk(x.itemListElement); };

    rec = buildImported({n:ld.name, ing:ld.recipeIngredient, steps:steps.filter(Boolean), t:parseIsoMin(ld.totalTime) || parseIsoMin(ld.cookTime) || 30, s:y || 2}, url);
  } else if (aiFn) {

/* ---- Geschmack: Schlüssel, Synonyme, Gruppen ---- */
const TGROUPS = {'Fisch':['Lachs','Kabeljau','Thunfisch'], 'Meeresfrüchte':['Garnelen'], 'Käse':['Käse','Mozzarella','Parmesan','Feta','Frischkäse']};

function ratingOf(name){
  const T = D.taste || {}, inf = ingInfo(name), k = norm(inf ? inf.n : name).trim();
  if (T[k] != null) return T[k];
  if (inf) for (const g in TGROUPS) if (T['@' + g] != null && TGROUPS[g].includes(inf.n)) return T['@' + g];
  const nn = norm(name);
  for (const c in T) if (c[0] === '~' && nn.includes(c.slice(1))) return T[c];
  return 0;
}
function rateMin(name){ return ratingOf(name); }
function myAllergies(){ return D.settings.allergies || []; }

}
function tasteEval(r){

  r.ing.forEach(i => { if (seen[i.n]) return; seen[i.n] = 1; const v = ratingOf(i.n); if (v === -2) o.never.push(i.n); else if (v === -1) o.dis.push(i.n); else if (v === 2) o.love.push(i.n); else if (v === 1) o.like.push(i.n); });
  return o;
}

/* ---- Ersatz für ungeliebte Zutaten (einfache Küchenregeln) ---- */
const SUBS = {'Champignons':'Zucchini','Zwiebel':'Lauch','Paprika':'Zucchini','Zucchini':'Paprika','Brokkoli':'Erbsen','Spinat':'Erbsen','Erbsen':'Brokkoli','Aubergine':'Zucchini','Karotte':'Paprika',
  'Lachs':'Hähnchenbrust','Kabeljau':'Hähnchenbrust','Garnelen':'Hähnchenbrust','Tofu':'Kichererbsen','Speck':'Schinken','Schinken':'Putenbrust','Feta':'Mozzarella','Mozzarella':'Käse','Parmesan':'Käse',
  'Sahne':'Kokosmilch','Kokosmilch':'Sahne','Kidneybohnen':'Mais','Mais':'Erbsen','Kirschtomaten':'Paprika','Frühlingszwiebel':'Lauch','Lauch':'Zwiebel','Hackfleisch':'Linsen'};
function subFor(r, name){
  const inf = ingInfo(name); if (!inf) return null;
  const t = SUBS[inf.n]; if (!t || rateMin(t) < 0) return null;
  const al = myAllergies(); if (al.length && [...allergensOf([t])].some(k => al.includes(k))) return null;
  const rn = norm(r.n); if ([inf.n].concat(inf.al || []).some(a => norm(a).length >= 4 && rn.includes(norm(a).slice(0, 4)))) return null;
  if (r.ing.some(i => i.n === t)) return {to:t, drop:true};
  return {to:t};
}
function subIngs(r){
  const out = [];
  r.ing.forEach(i => {
    if (rateMin(i.n) >= 0) { out.push(i); return; }
    const s = subFor(r, i.n); if (!s) { out.push(i); return; }
    if (s.drop || i.a == null) return;
    const inf = ingInfo(i.n), ti = ingInfo(s.to), g = gramsOf(inf, i.a, i.u);
    let a = i.a, u = i.u;
    if (g != null && ti) { const b = toBase(ti, g, 'g'); if (b && !b.odd) { a = b.base === 'Stk' ? Math.max(.5, Math.round(b.amt * 2) / 2) : Math.round(b.amt / 10) * 10 || b.amt; u = b.base; } }
    out.push({n:s.to, a, u, note:'statt ' + i.n, known:true, basic:false, sub:true});
  });
  return out;
}

    case 'imgPrompt': { const r = kcById(ds.id); if (!r) break; openSheet({type:'imgp', title:'Bild-Prompt', sub:`Für „${r.n}“. Auf Englisch, weil Bild-KIs damit am genauesten arbeiten.`, text:imgPrompt(r)}); break; }

/* ---------- 11 Eigenständiger Betrieb: Barcode-Scan (Open Food Facts) ---------- */
ui.bc = ui.bc || {status: 'idle', code: '', food: null, msg: ''};
const OFF_URL = 'https://world.openfoodfacts.org/api/v2/product/';

function offNum(v){ const n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v; return typeof n === 'number' && isFinite(n) ? n : null; }
/* Wandelt einen Open-Food-Facts-Datensatz in ein Lebensmittel um. Fehlen Werte, wird nichts erfunden. */
function offFood(code, p){
  const nu = (p && p.nutriments) || {};
  let k = offNum(nu['energy-kcal_100g']), fromKj = false;
  if (k == null) { const kj = offNum(nu['energy_100g']); if (kj != null) { k = kj / 4.184; fromKj = true; } }
  const pr = offNum(nu['proteins_100g']), c = offNum(nu['carbohydrates_100g']), f = offNum(nu['fat_100g']);
  const name = ((p && (p.product_name_de || p.product_name)) || '').trim();
  const brand = ((p && p.brands) || '').split(',')[0].trim();
  const out = {code, name, brand, complete: k != null && pr != null && c != null && f != null, fromKj,
    miss: [k == null ? 'Kalorien' : '', pr == null ? 'Protein' : '', c == null ? 'Kohlenhydrate' : '', f == null ? 'Fett' : ''].filter(Boolean)};
  if (out.complete) {
    const sg = offNum(p.serving_quantity);
    out.food = {id: 'off:' + code, n: (name || 'Produkt ' + code) + (brand && !norm(name).includes(norm(brand)) ? ' (' + brand + ')' : ''),
      per100: {k: R1(k), p: R1(pr), c: R1(c), f: R1(f)}, portion: sg && sg > 0 ? {name: (p.serving_size || 'Portion').slice(0, 24), g: sg} : null, src: 'off'};
  }
  return out;
}
async function offLookup(code){
  code = String(code || '').replace(/\D/g, '');
  if (code.length < 8 || code.length > 14) { ui.bc = {status: 'err', code, food: null, msg: 'Ein Barcode hat 8 bis 14 Ziffern.'}; render(); return; }
  ui.bc = {status: 'busy', code, food: null, msg: ''}; render();
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    const res = await fetch(OFF_URL + code + '.json?fields=code,product_name,product_name_de,brands,nutriments,serving_size,serving_quantity', {signal: ctl.signal});
    clearTimeout(t);
    const j = await res.json().catch(() => null);
    if (!j || j.status !== 1 || !j.product) { ui.bc = {status: 'nf', code, food: null, msg: ''}; render(); return; }
    ui.bc = {status: 'found', code, food: offFood(code, j.product), msg: ''};
  } catch (e) {
    ui.bc = {status: 'err', code, food: null, msg: navigator.onLine === false ? 'Keine Internetverbindung.' : 'Open Food Facts antwortet gerade nicht. Bitte später noch einmal versuchen.'};
  }
  render();
}

/* --- Dekodieren: eingebauter BarcodeDetector, sonst ZXing (wird erst bei Bedarf geladen) --- */
const BC_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
let zxReady = null;
function loadZX(){
  if (window.ZXing) return Promise.resolve();
  return zxReady || (zxReady = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = () => { zxReady = null; rej(new Error('zxing')); }; document.head.appendChild(s); }));
}
async function makeDecoder(){
  if ('BarcodeDetector' in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const fm = BC_FORMATS.filter(f => sup.includes(f));
      if (fm.length) { const d = new BarcodeDetector({formats: fm}); return async src => { const r = await d.detect(src); return r && r[0] ? r[0].rawValue : null; }; }
    } catch (e) {}
  }
  await loadZX();
  const Z = window.ZXing, hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
  return async src => {
    const w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height;
    if (!w || !h) return null;
    const sc = Math.min(1, 1000 / Math.max(w, h)); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
    cx.drawImage(src, 0, 0, cv.width, cv.height);
    try {
      const lum = new Z.HTMLCanvasElementLuminanceSource(cv);
      return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(lum))).getText();
    } catch (e) { return null; }
  };
}

  document.body.appendChild(o);
  o.querySelector('#bcX').onclick = bcStop;
  const v = o.querySelector('video'), msg = o.querySelector('#bcMsg');
  try {
    bcStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}}, audio: false});
    v.srcObject = bcStream; await v.play();
  } catch (e) { bcStop(); toast(e && e.name === 'NotAllowedError' ? 'Kamerazugriff wurde nicht erlaubt (iPhone: Einstellungen → Safari → Kamera).' : 'Kamera konnte nicht gestartet werden.'); return; }
  let dec; try { dec = await makeDecoder(); } catch (e) { msg.textContent = 'Scanner konnte nicht geladen werden. Tippe die Zahl ein.'; return; }
  bcLoop = true;
  while (bcLoop) {
    let code = null; try { code = await dec(v); } catch (e) {}
    if (code && /^\d{8,14}$/.test(code)) { bcStop(); if (navigator.vibrate) navigator.vibrate(40); ui.scanTab = 'code'; offLookup(code); return; }
    await new Promise(r => setTimeout(r, 140));
  }
}
async function bcFromFile(file){
  if (!file) return;
  ui.bc = {status: 'busy', code: '', food: null, msg: ''}; render();
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const dec = await makeDecoder(); const code = await dec(img);
    if (code && /^\d{8,14}$/.test(code)) { offLookup(code); return; }
    ui.bc = {status: 'err', code: '', food: null, msg: 'Auf dem Foto wurde kein Barcode erkannt. Bitte näher und scharf aufnehmen oder die Zahl eintippen.'};
  } catch (e) { ui.bc = {status: 'err', code: '', food: null, msg: 'Das Foto konnte nicht gelesen werden.'}; }
  URL.revokeObjectURL(url); render();
}

const _viewScan8 = viewScan;
viewScan = function(){
  if (ui.scanTab !== 'code') return _viewScan8();
  return `<div class="fade"><h1>Hinzufügen</h1>${seg([['code', 'Barcode'], ['photo', 'Foto'], ['search', 'Suchen'], ['mine', 'Eigene'], ['favs', 'Favoriten']], 'code', 'scanTab')}${viewCode()}</div>`;
};
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act^="bc"]'); if (!a) return;
  switch (a.dataset.act) {
    case 'bcScan': bcScan(); break;
    case 'bcFind': { const i = document.getElementById('bcIn'); offLookup(i ? i.value : ui.bc.code); break; }
    case 'bcPick': if (ui.bc.food && ui.bc.food.food) openPortion(ui.bc.food.food, 'log'); break;
  }
});
document.addEventListener('input', ev => { const t = ev.target; if (t && t.dataset && t.dataset.in === 'bcCode') ui.bc.code = t.value; });
document.addEventListener('change', ev => { const t = ev.target; if (t && t.dataset && t.dataset.in === 'bcFile') { const f = t.files && t.files[0]; t.value = ''; bcFromFile(f); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target && ev.target.id === 'bcIn') { ev.preventDefault(); offLookup(ev.target.value); } });

/* Sync-Verbindung nachholen, falls der erste Versuch offline scheiterte */
if (window.NS && NS.cloud) {
  let _icBusy = false; const _initCloud8 = initCloud;
  initCloud = async function(){ if (_icBusy) return; _icBusy = true; try { await _initCloud8(); } finally { _icBusy = false; } };
  setInterval(() => { if (!hh.on && ui.sync === 'local' && document.visibilityState === 'visible') initCloud(); }, 20000);
  window.addEventListener('online', () => { if (!hh.on) initCloud(); });
}

/* ---------- 10 Start ---------- */
(function start(){
  loadLocal();
  if (!D.weights.length && D.updated === 0) { D.weights = [{id:uid(), d:todayStr(), kg:D.settings.weight}]; }
  applyTheme(); render(true);
  initAI(); initCloud();
})();
</script>
