<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriSnap">
<meta name="theme-color" content="#101114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="fotos.js" defer onload="try{render()}catch(e){}"></script>
<script>
/* NutriSnap – eigenständiger Betrieb ohne Claude.
   Stellt dieselbe kleine Schnittstelle bereit, die die App sonst von Claude bekommt:
   claude.use('db' | 'user' | 'assets' | 'downloads' | 'sample').
   - Ohne Eintrag in config.js: nur lokal (Daten bleiben auf dem Gerät).
   - Mit Supabase-Zugangsdaten in config.js: Konto-Login, gemeinsame Daten, Bilder in der Cloud. */
(function () {
  'use strict';
  var CFG = window.NUTRISNAP_CONFIG || {};
  var URL_ = String(CFG.supabaseUrl || '').replace(/\/+$/, '');
  var KEY = String(CFG.supabaseKey || '');
  var CLOUD = !!(URL_ && KEY);
  var SESS_KEY = 'nutrisnap.sa.session';
  var NS = window.NS = { cloud: CLOUD, user: null };

  /* ---------- kleine Helfer ---------- */
  function jparse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function httpErr(res, text) {
    var e = new Error('HTTP ' + res.status + (text ? ': ' + String(text).slice(0, 200) : '')); e.status = res.status; return e;
  }

  /* ---------- Bilder (lokal im Cache, in der Cloud in Supabase Storage) ---------- */
  var blobMem = {};
  window.nsBlobUrl = function (id) {
    id = String(id || '');
    if (id.indexOf('sb-') === 0) return URL_ + '/storage/v1/object/public/img/' + id.slice(3);
    return blobMem[id] || '_blob/' + id;
  };

  /* ---------- Schutz: keine Neulade-Schleife, Fehler sichtbar machen ---------- */
  function safeReload() {
    var now = Date.now(), a = (jparse(sessionStorage.getItem('ns.rl')) || []).filter(function (t) { return now - t < 30000; });
    a.push(now); try { sessionStorage.setItem('ns.rl', JSON.stringify(a)); } catch (e) {}
    if (a.length > 2) { showBlock('Die Anmeldung konnte nicht abgeschlossen werden. Bitte melde dich ab und noch einmal an.'); return false; }
    location.reload(); return true;
  }
  function errBar(msg) {
    try {
      var b = document.getElementById('nsErrBar');
      if (!b) { b = document.createElement('div'); b.id = 'nsErrBar';
        b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99998;background:#3a1512;color:#ffd9d4;border:1px solid #7a2a22;border-radius:12px;padding:10px 12px;font:13px/1.35 -apple-system,system-ui,sans-serif';
        b.onclick = function () { b.remove(); }; document.body.appendChild(b); }
      b.textContent = 'Fehler: ' + String(msg).slice(0, 220) + ' (antippen zum Schließen)';
    } catch (e) {}
  }
  window.addEventListener('error', function (e) { errBar(e.message || 'unbekannt'); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errBar((r && r.message) || r || 'unbekannt'); });

  /* ---------- Sitzung (nur Cloud-Modus) ---------- */
  var session = jparse(localStorage.getItem(SESS_KEY));
  var member = null;
  var refreshing = null;

  function saveSession(s) {
    session = s;
    try { if (s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); } catch (e) {}
  }
  function fromAuth(j) {
    return { access: j.access_token, refresh: j.refresh_token,
      exp: Date.now() + ((j.expires_in || 3600) * 1000), id: j.user && j.user.id, email: j.user && j.user.email };
  }
  async function auth(path, body) {
    var res = await fetch(URL_ + '/auth/v1/' + path, { method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var j = await res.json().catch(function () { return {}; });
    if (!res.ok) { var e = new Error(j.error_description || j.msg || j.message || ('HTTP ' + res.status)); e.status = res.status; e.body = j; throw e; }
    return j;
  }
  async function token() {
    if (!session) throw new Error('nicht angemeldet');
    if (session.exp - Date.now() > 60000) return session.access;
    if (!refreshing) {
      refreshing = (async function () {
        try {
          var j = await auth('token?grant_type=refresh_token', { refresh_token: session.refresh });
          var s = fromAuth(j); if (!s.id) { s.id = session.id; s.email = session.email; } saveSession(s);
        } catch (e) {
          if (e.status === 400 || e.status === 401 || e.status === 403) { saveSession(null); safeReload(); }
          throw e;
        } finally { refreshing = null; }
      })();
    }
    await refreshing; return session.access;
  }
  async function rest(method, path, body, extra) {
    var t = await token();
    var h = { apikey: KEY, Authorization: 'Bearer ' + t };
    if (body !== undefined) h['Content-Type'] = 'application/json';
    if (extra) for (var k in extra) h[k] = extra[k];
    var res = await fetch(URL_ + '/rest/v1/' + path, { method: method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
    if (!res.ok) throw httpErr(res, await res.text().catch(function () { return ''; }));
    if (res.status === 204) return null;
    var tx = await res.text(); return tx ? jparse(tx) : null;
  }
  var enc = encodeURIComponent;

  /* ---------- Anmeldebildschirm ---------- */
  var loginDone = null;
  function loginUI() {
    return new Promise(function (resolve) {
      var el = document.createElement('div');
      el.id = 'nsLogin';
      el.innerHTML =
        '<style>#nsLogin{position:fixed;inset:0;z-index:99999;background:#101114;color:#F5F2ED;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}' +
        '#nsLogin .b{width:100%;max-width:360px}#nsLogin h1{margin:0 0 4px;font-size:30px;font-weight:700;letter-spacing:-.5px}' +
        '#nsLogin p{margin:0 0 22px;color:#A5A5A8;font-size:15px;line-height:1.4}' +
        '#nsLogin input{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:14px;border-radius:14px;border:1px solid #303238;background:#1C1E22;color:#F5F2ED;font-size:17px;outline:none}' +
        '#nsLogin input:focus{border-color:#D6AD72}' +
        '#nsLogin button{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:650;background:#D6AD72;color:#1a1408;margin-top:4px}' +
        '#nsLogin button.s{background:none;color:#D6AD72;font-weight:550;margin-top:6px}#nsLogin button:disabled{opacity:.5}' +
        '#nsLogin .e{min-height:20px;margin:6px 2px 6px;color:#EC8B7B;font-size:14px}</style>' +
        '<div class="b"><h1>NutriSnap</h1><p id="nsLoginSub">Melde dich an, damit eure gemeinsamen Daten auf allen Geräten ankommen.</p>' +
        '<input id="nsEm" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" placeholder="E-Mail">' +
        '<input id="nsPw" type="password" autocomplete="current-password" placeholder="Passwort (mind. 8 Zeichen)">' +
        '<div class="e" id="nsErr"></div><button id="nsGo">Anmelden</button>' +
        '<button class="s" id="nsMode">Noch kein Konto? Konto anlegen</button></div>';
      document.body.appendChild(el);
      var mode = 'in', $ = function (i) { return el.querySelector('#' + i); };
      $('nsMode').onclick = function () {
        mode = mode === 'in' ? 'up' : 'in';
        $('nsGo').textContent = mode === 'in' ? 'Anmelden' : 'Konto anlegen';
        $('nsMode').textContent = mode === 'in' ? 'Noch kein Konto? Konto anlegen' : 'Schon ein Konto? Anmelden';
        $('nsPw').autocomplete = mode === 'in' ? 'current-password' : 'new-password'; $('nsErr').textContent = '';
      };
      $('nsGo').onclick = async function () {
        var em = $('nsEm').value.trim(), pw = $('nsPw').value;
        $('nsErr').textContent = '';
        if (!em || pw.length < 8) { $('nsErr').textContent = 'Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.'; return; }
        $('nsGo').disabled = true;
        try {
          var j;
          if (mode === 'up') {
            j = await auth('signup', { email: em, password: pw });
            if (!j.access_token) throw new Error('Bestätigung per E-Mail ist noch eingeschaltet. In Supabase unter Authentication → Providers → Email „Confirm email“ ausschalten.');
          } else j = await auth('token?grant_type=password', { email: em, password: pw });
          saveSession(fromAuth(j));
          el.remove(); resolve();
        } catch (e) {
          var m = String(e.message || e);
          if (/invalid login/i.test(m)) m = 'E-Mail oder Passwort stimmt nicht.';
          else if (/already registered|already been registered/i.test(m)) m = 'Diese E-Mail hat schon ein Konto. Bitte anmelden.';
          else if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = 'Keine Verbindung. Bitte Internet prüfen.';
          $('nsErr').textContent = m;
        }
        $('nsGo').disabled = false;
      };
    });
  }
  function showBlock(msg) {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#101114;color:#F5F2ED;display:flex;align-items:center;justify-content:center;padding:28px;font:16px/1.45 -apple-system,system-ui,sans-serif;text-align:center';
    el.innerHTML = '<div style="max-width:340px"><h2 style="margin:0 0 10px">Kein Zugang</h2><p style="color:#A5A5A8;margin:0 0 18px">' + msg + '</p>' +
      '<button style="padding:14px 22px;border:0;border-radius:14px;background:#D6AD72;color:#1a1408;font-size:16px;font-weight:650">Abmelden</button></div>';
    el.querySelector('button').onclick = function () { saveSession(null); try { sessionStorage.removeItem('ns.rl'); } catch (e) {} location.reload(); };
    document.body.appendChild(el);
  }

  async function ensureLogin() {
    if (!session) { if (!loginDone) loginDone = loginUI(); await loginDone; }
    var offline = false;
    try {
      var rows = await rest('GET', 'members?select=email,name,owner&email=ilike.' + enc(session.email));
      member = rows && rows[0];
    } catch (e) {
      if (e.status === 401 || e.status === 403) { saveSession(null); safeReload(); return new Promise(function () {}); }
      offline = true;
      member = jparse(localStorage.getItem('nutrisnap.sa.member'));
    }
    if (!member) {
      if (offline) { member = { email: session.email, name: '', owner: false }; }
      else { showBlock('Die E-Mail <b>' + session.email + '</b> ist noch nicht freigeschaltet. Trag sie in Supabase in der Tabelle „members“ ein (siehe Einrichtung).'); return new Promise(function () {}); }
    } else {
      try { localStorage.setItem('nutrisnap.sa.member', JSON.stringify(member)); } catch (e) {}
      rest('POST', 'profiles?on_conflict=id', { id: session.id, name: member.name || '' },
        { Prefer: 'resolution=merge-duplicates,return=minimal' }).catch(function () {});
    }
    NS.user = { id: session.id, email: session.email, name: member.name || '', owner: !!member.owner };
  }
  var ready = null;
  function login() { return ready || (ready = ensureLogin()); }

  /* ---------- Datenbank (Supabase, Tabelle "docs") ---------- */
  function mkDoc(r) { return { id: r.id, data: function () { return r.data; } }; }
  var subs = {};            /* pfad -> {cbs:[], sig:null} */
  var pollT = null, polling = false;

  async function fetchColl(path) {
    var rows = await rest('GET', 'docs?select=id,data&path=eq.' + enc(path) + '&order=id.asc');
    return (rows || []).map(mkDoc);
  }
  async function pollOnce() {
    if (polling) return; polling = true;
    try {
      var paths = Object.keys(subs); if (!paths.length) return;
      var hhSigs = null;
      if (paths.some(function (p) { return p.indexOf('hh/') === 0; })) {
        var st = await rest('POST', 'rpc/hh_state', {});
        hhSigs = {}; (st || []).forEach(function (r) { hhSigs[r.path] = r.sig; });
      }
      for (var i = 0; i < paths.length; i++) {
        var p = paths[i], s = subs[p]; if (!s) continue;
        var cur = hhSigs && p.indexOf('hh/') === 0 ? (hhSigs[p] || 'leer') : null;
        if (cur !== null && cur === s.sig) continue;
        var docs = await fetchColl(p);
        if (cur === null) { var sg = docs.map(function (d) { return d.id + JSON.stringify(d.data()); }).join('|'); if (sg === s.sig) continue; s.sig = sg; }
        else s.sig = cur;
        s.cbs.forEach(function (cb) { try { cb({ docs: docs }); } catch (e) {} });
      }
    } catch (e) {
      Object.keys(subs).forEach(function (p) { (subs[p].errs || []).forEach(function (f) { try { f(e); } catch (x) {} }); });
    } finally { polling = false; }
  }
  function startPoll() {
    if (pollT) return;
    pollT = setInterval(function () { if (document.visibilityState === 'visible') pollOnce(); }, 4000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') pollOnce(); });
    window.addEventListener('online', pollOnce);
    window.addEventListener('focus', pollOnce);
  }
  function collection(path) {
    return {
      get: async function () { return { docs: await fetchColl(path) }; },
      onSnapshot: function (cb, err) {
        var s = subs[path] || (subs[path] = { cbs: [], errs: [], sig: null });
        s.cbs.push(cb); if (err) s.errs.push(err);
        s.sig = null; startPoll(); setTimeout(pollOnce, 0);
        return function () { var i = s.cbs.indexOf(cb); if (i >= 0) s.cbs.splice(i, 1); };
      },
      doc: function (id) {
        return {
          set: async function (data) {
            await rest('POST', 'docs?on_conflict=path,id', { path: path, id: String(id), data: data },
              { Prefer: 'resolution=merge-duplicates,return=minimal' });
          },
          get: async function () {
            var r = await rest('GET', 'docs?select=id,data&path=eq.' + enc(path) + '&id=eq.' + enc(id));
            return r && r[0] ? mkDoc(r[0]) : null;
          },
          delete: async function () { await rest('DELETE', 'docs?path=eq.' + enc(path) + '&id=eq.' + enc(id), undefined, { Prefer: 'return=minimal' }); }
        };
      }
    };
  }

  /* ---------- Bildspeicher ---------- */
  var cloudAssets = {
    upload: async function (blob) {
      var t = await token(), name = uuid() + '.jpg';
      var res = await fetch(URL_ + '/storage/v1/object/img/' + name, { method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': blob.type || 'image/jpeg', 'x-upsert': 'false' }, body: blob });
      if (!res.ok) throw httpErr(res, await res.text().catch(function () { return ''; }));
      return { id: 'sb-' + name };
    },
    delete: async function (id) {
      id = String(id || ''); if (id.indexOf('sb-') !== 0) return;
      var t = await token();
      await fetch(URL_ + '/storage/v1/object/img/' + id.slice(3), { method: 'DELETE', headers: { apikey: KEY, Authorization: 'Bearer ' + t } });
    }
  };
  var localAssets = {
    upload: async function (blob) {
      var id = 'l-' + uuid().slice(0, 12);
      if (!window.caches) throw new Error('Speicher nicht verfügbar');
      var c = await caches.open('ns-blobs');
      await c.put(new URL('_blob/' + id, document.baseURI).href, new Response(blob, { headers: { 'Content-Type': blob.type || 'image/jpeg' } }));
      try { blobMem[id] = URL.createObjectURL(blob); } catch (e) {}
      return { id: id };
    },
    delete: async function (id) {
      if (!window.caches) return; var c = await caches.open('ns-blobs'); await c.delete(new URL('_blob/' + id, document.baseURI).href); delete blobMem[id];
    }
  };

  /* ---------- Dateien sichern / teilen ---------- */
  var downloads = {
    save: async function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([String(o.data)], { type: /\.json$/i.test(o.filename) ? 'application/json' : 'text/plain' });
      try {
        var file = new File([blob], o.filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) { if (e && e.name === 'AbortError') { var d = new Error('declined'); d.code = 'declined'; throw d; } }
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename;
      document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); URL.revokeObjectURL(a.href); }, 4000);
    }
  };

  /* ---------- claude.use ---------- */
  window.claude = {
    use: async function (name) {
      if (name === 'downloads') return downloads;
      if (name === 'assets') { if (CLOUD) { await login(); return cloudAssets; } return localAssets; }
      if (!CLOUD) return null;                       /* db, user, sample: nur mit Server */
      if (name === 'db') { await login(); return { collection: collection }; }
      if (name === 'user') {
        await login();
        return {
          id: async function () { return session.id; },
          isOwner: async function () { return !!(member && member.owner); },
          can: async function () { return true; },
          profiles: async function (ids) {
            var out = {}; if (!ids || !ids.length) return out;
            var rows = await rest('GET', 'profiles?select=id,name&id=in.(' + ids.map(enc).join(',') + ')');
            (rows || []).forEach(function (r) { out[r.id] = { name: r.name }; }); return out;
          }
        };
      }
      return null;                                   /* sample: keine eingebaute KI */
    }
  };

  /* App-Hülle: Dienst-Worker für Offline-Betrieb */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();

</script>
<title>NutriSnap</title>
<style>
:root{
  --bg:#0C100E;--card:#161C19;--card2:#1E2622;--line:rgba(255,255,255,.07);
  --ink:#EEF3EF;--ink2:#A5B1AA;--ink3:#6F7C75;
  --acc:#52C68F;--accInk:#06140D;--accSoft:rgba(82,198,143,.14);
  --prot:#7CB4F5;--carb:#F0B95C;--fat:#E58FAE;
  --warn:#F0A04B;--bad:#EC6B5B;--shadow:0 10px 30px rgba(0,0,0,.35);
  --num:ui-rounded,"SF Pro Rounded",-apple-system,"SF Pro Display",system-ui,sans-serif;
}
[data-theme=light]{
  --bg:#F2F5F3;--card:#FFFFFF;--card2:#EAF0EC;--line:rgba(0,0,0,.08);
  --ink:#101512;--ink2:#56625B;--ink3:#8A958F;
  --acc:#1F9D63;--accInk:#fff;--accSoft:rgba(31,157,99,.12);
  --prot:#2F7FD6;--carb:#B97A08;--fat:#C24574;
  --warn:#C77A18;--bad:#D14B3B;--shadow:0 8px 24px rgba(20,40,30,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
body{overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
#main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.wrap{max-width:560px;margin:0 auto}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:32px;letter-spacing:-.02em;margin:6px 0 14px;font-weight:750}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 10px;letter-spacing:.01em}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.row2{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.small{font-size:13px}.tiny{font-size:12px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
/* tabbar */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 10px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:20}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink3);font-size:11px;font-weight:600;border-radius:14px;transition:color .2s}
#tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.on{color:var(--acc)}
/* date strip */
.dstrip{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 12px}
.dstrip .t{font-size:17px;font-weight:650;text-align:center;flex:1}
.ib{width:40px;height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--ink2)}
.ib:active{transform:scale(.94)}
/* ring */
.ringbox{position:relative;width:220px;height:220px;margin:0 auto}
.ring{width:220px;height:220px}
.ring circle{fill:none;stroke-width:15;stroke-linecap:round}
.ring .rt{stroke:var(--card2)}
.ring .rp{stroke:var(--acc);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .rp.over{stroke:var(--warn)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc .big{font-family:var(--num);font-size:46px;font-weight:750;letter-spacing:-.03em;line-height:1}
.ringc .lbl{font-size:13px;color:var(--ink2);margin-top:4px}
.trio{display:flex;justify-content:space-around;margin-top:10px;text-align:center}
.trio b{display:block;font-family:var(--num);font-size:20px}
.trio span{font-size:12px;color:var(--ink2)}
.calcline{font-size:12px;color:var(--ink3);text-align:center;margin-top:12px}
/* bars */
.mrow{margin:12px 0}
.mrow .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mrow .nm{display:flex;align-items:center;gap:7px;font-weight:600}
.dot{width:9px;height:9px;border-radius:5px;display:inline-block}
.track{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
/* rows */
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row:active{opacity:.6}
.r-main{flex:1;min-width:0}
.r-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12.5px;color:var(--ink2);margin-top:1px}
.r-k{font-family:var(--num);font-weight:700;font-size:17px;text-align:right}
.r-k small{display:block;font-weight:500;font-size:11px;color:var(--ink3)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.mh b{font-size:17px}
.addb{width:34px;height:34px;border-radius:17px;background:var(--accSoft);color:var(--acc);font-size:22px;line-height:1;display:grid;place-items:center;font-weight:500}
.addb:active{transform:scale(.92)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--accSoft);color:var(--acc);margin-left:6px;vertical-align:1px}
.tag.warn{background:rgba(240,160,75,.16);color:var(--warn)}
.empty{color:var(--ink3);font-size:14px;padding:6px 0 4px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;background:var(--acc);color:var(--accInk);font-weight:700;font-size:17px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card2);color:var(--ink)}
.btn.danger{background:rgba(236,107,91,.14);color:var(--bad)}
.btn.sm{padding:10px 14px;font-size:15px;width:auto;border-radius:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);transition:all .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.inp{width:100%;background:var(--card2);border:1px solid transparent;border-radius:14px;padding:13px 14px;font-size:17px;outline:0;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--acc)}
.lab{font-size:12.5px;color:var(--ink2);margin:10px 0 5px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:8px 13px;border-radius:20px;background:var(--card2);font-size:14px;font-weight:600}
.chip:active{background:var(--accSoft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--card2);color:var(--ink2);font-weight:600}
.pill.ok{background:var(--accSoft);color:var(--acc)}
.pill.warn{background:rgba(240,160,75,.16);color:var(--warn)}
.note{font-size:13px;color:var(--ink2);background:var(--card2);border-radius:14px;padding:11px 13px;margin:10px 0}
.note.warn{background:rgba(240,160,75,.12);color:var(--warn)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .ib{border-radius:14px;width:46px;height:46px;font-size:22px}
.stepper input{text-align:center;font-family:var(--num);font-size:26px;font-weight:700;padding:8px}
.cbox{background:var(--card2);border-radius:18px;padding:14px;margin:12px 0}
.cbox .k{font-family:var(--num);font-size:38px;font-weight:750;letter-spacing:-.02em}
.mpills{display:flex;gap:8px;margin-top:8px}
.mpills div{flex:1;background:var(--card);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--ink2)}
.mpills b{display:block;font-family:var(--num);font-size:17px;color:var(--ink)}
.formula{font-size:12px;color:var(--ink3);margin-top:8px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fadeo .2s ease both}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .3s cubic-bezier(.2,.9,.2,1) both;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pn .grab{width:38px;height:5px;border-radius:3px;background:var(--ink3);opacity:.5;margin:2px auto 10px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-h b{font-size:20px;flex:1}
.x{width:32px;height:32px;border-radius:16px;background:var(--card2);color:var(--ink2);display:grid;place-items:center;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:70;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* charts */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--ink3);font-size:10.5px;font-family:-apple-system,system-ui,sans-serif}
svg.ch .goal{stroke:var(--ink3);stroke-dasharray:4 4;stroke-width:1}
svg.ch .base{stroke:var(--line);stroke-width:1}
.readout{font-size:14px;font-weight:600;min-height:20px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats div{background:var(--card2);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-family:var(--num);font-size:20px}
.stats span{font-size:12px;color:var(--ink2)}
.drops{display:flex;gap:6px;margin-top:6px}
.drop{flex:1;height:34px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink3);transition:all .3s}
.drop.on{background:var(--accSoft);color:var(--acc)}
.photo{width:100%;max-height:300px;object-fit:cover;border-radius:18px;display:block;margin-bottom:12px}
.pick{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 16px;border:2px dashed var(--line);border-radius:22px;text-align:center;color:var(--ink2);cursor:pointer}
.pick svg{width:44px;height:44px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pick b{color:var(--ink);font-size:18px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--acc);animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.item{background:var(--card2);border-radius:18px;padding:13px;margin-bottom:10px}
.item .hd{display:flex;gap:8px;align-items:flex-start}
.item .hd b{flex:1}
.irow{display:flex;align-items:center;gap:10px;margin-top:10px}
.irow .stepper .ib{width:36px;height:36px;font-size:18px;border-radius:12px;background:var(--card)}
.irow input{width:78px;padding:8px;font-size:17px;border-radius:12px;background:var(--card)}
details summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:600;margin:10px 0}
textarea.inp{min-height:84px;resize:vertical}
a{color:var(--acc)}
/* ---- Erweiterung: Rezepte ---- */
.chip.on{background:var(--accSoft);color:var(--acc)}
.acts{display:grid;gap:8px;margin-bottom:12px}
.act{display:flex;flex-direction:column;gap:2px;padding:13px 15px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:transform .12s,border-color .2s}
.act b{font-size:16px}.act span{font-size:12.5px;color:var(--ink2)}
.act:active{transform:scale(.985)}.act.on{border-color:var(--acc);background:var(--accSoft)}
.rcard{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.rcard:first-of-type{border-top:0}
.rcard:active{opacity:.65}
.rtile{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,var(--accSoft),var(--card2));display:grid;place-items:center;font-size:30px;flex:none}
.rbody{flex:1;min-width:0}
.rname{font-weight:650;font-size:16px;line-height:1.25}
.rmeta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.rmac{font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.star{font-size:24px;line-height:1;color:var(--ink3);width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.star.on{color:var(--carb)}
.star.big{font-size:28px;margin-top:6px}
.hero{height:150px;border-radius:24px;background:linear-gradient(145deg,var(--accSoft),var(--card2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-bottom:6px}
.hero span{font-size:72px;line-height:1}.hero small{font-size:11px;color:var(--ink3)}
.back{color:var(--acc);font-size:17px;font-weight:600;padding:8px 0;margin-bottom:4px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:4px 0 12px 38px;line-height:1.45}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:13px;background:var(--accSoft);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.chk{width:28px;height:28px;border-radius:14px;border:2px solid var(--ink3);flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--accInk)}
.chk.on{background:var(--acc);border-color:var(--acc)}
.done{text-decoration:line-through;color:var(--ink3)}
.prow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.plslot{width:70px;flex:none;font-size:12px;color:var(--ink3);font-weight:600}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column}
.pmain .r-name{white-space:normal}
.prow .x{flex:none}

/* ---- Koch-App ---- */
.ksearch{margin:6px 0 10px}
.kcats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.kcats::-webkit-scrollbar{display:none}
.kc{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.kc span{font-size:18px}.kc.on{background:var(--accSoft);color:var(--acc);border-color:transparent}
.kfilters{display:grid;gap:8px;margin:2px 0 6px}
.kgrid{display:grid;gap:18px}
@media(min-width:640px){.kgrid{grid-template-columns:1fr 1fr}}
.kcard{border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 300px;transition:transform .15s}
.kcard:active{transform:scale(.985)}
.kimg{position:relative;aspect-ratio:400/260;background:var(--card2)}
.kimg svg,.khero svg{display:block;width:100%;height:100%}
.kbody{padding:12px 15px 14px}
.kname{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.kmeta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:13px;color:var(--ink2)}
.kmeta.big{font-size:14px;margin:0 0 14px}
.kmeta .vg{color:var(--acc)}
.kfav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:20px;background:rgba(0,0,0,.42);color:#fff;font-size:21px;display:grid;place-items:center}
.kfav.on{color:#ff6b7f}.kfav.lg{top:14px;right:14px;width:46px;height:46px;font-size:24px}
.kadd{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:21px;background:var(--acc);color:#04210f;font-size:22px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.khero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:400/260;background:var(--card2)}
.kbtns{display:grid;gap:10px;margin:0 0 12px}
.btn.sec.on{color:#ff6b7f}
.stars{display:flex;gap:2px;margin-top:2px}
.stars button{font-size:30px;color:var(--ink3);width:40px;height:40px;display:grid;place-items:center}
.stars button.on{color:var(--carb)}
.kfit{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;width:100%;margin-top:22px;padding:15px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.kfit span{font-size:12.5px;color:var(--ink2)}
.chip.static{pointer-events:none}.chip.sm{padding:5px 10px;font-size:12.5px}
.ib.sm{width:34px;height:34px;font-size:15px}
.trknav{margin:0 0 4px}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wkday{padding-bottom:10px}.wkday.today{border-color:var(--acc)}.wkday.past{opacity:.6}
.went{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wthumb{width:76px;height:50px;border-radius:12px;overflow:hidden;flex:none;background:var(--card2);display:grid;place-items:center;font-size:24px;cursor:pointer}
.wthumb svg{width:100%;height:100%;display:block}
.wthumb.sm{width:56px;height:38px;border-radius:10px}
.wmain{flex:1;min-width:0}.wmain .r-name{white-space:normal;font-weight:650;line-height:1.25;cursor:pointer}
.wctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}.wctl .num{min-width:54px;text-align:center;font-size:13.5px}
.wact{display:flex;flex-direction:column;gap:2px;flex:none}
.wkadd{width:100%;padding:10px;border-radius:12px;border:1px dashed var(--line);color:var(--ink2);font-size:14px;margin-top:6px}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:12px;background:var(--card2);position:relative}
.dbtn b{font-size:13px}.dbtn span{font-size:11px;color:var(--ink2)}.dbtn i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:3px;background:var(--acc)}
.dbtn.on{background:var(--accSoft);outline:2px solid var(--acc)}
.crow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}.cmain{flex:1;min-width:0;cursor:pointer}.cmain .r-name{white-space:normal}
.crow.done .cmain{opacity:.5}.crow.done .r-name{text-decoration:line-through}
.stackb{display:grid;gap:10px}
textarea.inp{resize:vertical;font-family:inherit}
#tabbar button{position:relative}
#tabbar .bdg{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acc);color:#04210f;font-size:11px;font-weight:800;font-style:normal;display:grid;place-items:center}

/* ---- Dark Premium ---- */
:root:not([data-theme=light]){--bg:#101114;--card:#1C1E22;--card2:#25272C;--line:#303238;--ink:#F5F2ED;--ink2:#A5A5A8;--ink3:#77777C;--acc:#D6AD72;--accInk:#1B1509;--accSoft:rgba(214,173,114,.13);--shadow:0 18px 44px rgba(0,0,0,.5)}
[data-theme=light]{--acc:#8F6A2E;--accInk:#fff;--accSoft:rgba(143,106,46,.12)}
:root{--disp:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif}
body{letter-spacing:.005em}
#main{padding-bottom:calc(env(safe-area-inset-bottom) + 118px);scroll-behavior:auto}
h1{font-family:var(--disp);font-weight:600;letter-spacing:-.012em;line-height:1.1}
.card{border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,.045)}
[data-theme=light] .card{border-color:var(--line)}
.btn{border-radius:18px;font-size:16.5px;letter-spacing:.005em}
.btn.sec{background:var(--card2)}
.inp{border-radius:16px}
.seg{background:var(--card);border-radius:16px;padding:4px;margin-bottom:16px}
.seg button{border-radius:12px;padding:10px 4px}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:none}
.chip{background:var(--card);border:1px solid rgba(255,255,255,.05)}
.chip.on{border-color:transparent}
.chip.on.bad{background:rgba(236,107,91,.15);color:var(--bad)}
.back{font-size:16px}
.pn{border-top:1px solid rgba(255,255,255,.07)}
#tabbar{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:536px;margin:0 auto;padding:6px;border-radius:30px;border:1px solid rgba(255,255,255,.08);background:rgba(30,32,37,.72);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 14px 36px rgba(0,0,0,.55)}
[data-theme=light] #tabbar{background:rgba(255,255,255,.78);border-color:rgba(0,0,0,.08);box-shadow:0 10px 30px rgba(0,0,0,.15)}
#tabbar button{font-size:10.5px;padding:7px 0 6px;min-height:50px;border-radius:24px}
#tabbar button svg{width:23px;height:23px;stroke-width:1.7}
#tabbar button.on{background:rgba(255,255,255,.05)}
#tabbar .bdg{color:var(--accInk)}
#toast{bottom:calc(env(safe-area-inset-bottom) + 96px)}
.ic svg,.kfav svg,.kmore svg,.kadd svg,.swb svg,.ti svg,.mi svg,.kacts i svg,.swpromo i svg,.tdot svg,.wact svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
svg [fill=currentColor]{fill:currentColor}
.ib.ic{color:var(--ink)}
/* Startseite */
.khead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px}
.khead p{margin:0 0 2px;color:var(--acc);font-size:14px;font-weight:600}
.khead h1{margin:0;font-size:31px}
.ksearch{margin:0 0 14px;padding:16px 18px;border-radius:18px;background:var(--card);font-size:16.5px}
.kcats{gap:8px;padding:0 16px 14px;margin:0 -16px}
.kc{padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid rgba(255,255,255,.05);font-size:14.5px;font-weight:600;color:var(--ink2)}
.kc.on{background:var(--ink);color:var(--bg)}
.kshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(16,17,20,0) 55%,rgba(16,17,20,.55) 100%)}
.kshade.strong{background:linear-gradient(180deg,rgba(16,17,20,0) 40%,rgba(16,17,20,.82) 72%,rgba(16,17,20,.96) 100%)}
.kshade.top{background:linear-gradient(180deg,rgba(16,17,20,.55) 0,rgba(16,17,20,0) 26%,rgba(16,17,20,0) 70%,var(--bg) 100%)}
img.kph{width:100%;height:100%;object-fit:cover;display:block}
.khero{position:relative;display:block;aspect-ratio:4/4.6;border-radius:30px;overflow:hidden;background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
.khero>svg,.khero>img,.pc>svg,.pc>img,.swcard>svg,.swcard>img,.kdhero>svg,.kdhero>img,.hcimg>svg,.rcimg>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kherot{position:absolute;left:22px;right:22px;bottom:22px;display:flex;flex-direction:column;gap:5px}
.kherot span{font-size:13px;font-weight:600;color:var(--acc)}
.kherot b{font-family:var(--disp);font-size:31px;font-weight:600;line-height:1.08;letter-spacing:-.01em}
.kherot em{font-style:normal;font-size:14px;color:rgba(245,242,237,.8)}
.kfav{width:42px;height:42px;border-radius:21px;background:rgba(16,17,20,.5);color:#fff;display:grid;place-items:center;top:12px;right:12px}
.kfav.on{color:var(--acc)}
.kmore{position:absolute;top:12px;right:62px;width:42px;height:42px;border-radius:21px;background:rgba(16,17,20,.5);color:#fff;display:grid;place-items:center}
.kfav.sm,.kmore.sm{width:36px;height:36px;top:8px;right:8px}.kmore.sm{right:50px}

function migrate(core){

  c.taste = c.taste || {}; c.tasteX = c.tasteX || {}; c.rx = c.rx || {}; c.aff = c.aff || {}; c.tpref = c.tpref || {n:0,sum:0}; c.seen = c.seen || {}; c.photos = c.photos || {}; c.imgAi = c.imgAi || {}; c.hhBase = c.hhBase || {};

function touch(monthKey){

}
function setSync(s){ if (s) ui.sync = s; }
async function flush(){
  if (!dbc) return;
  if (flushing) { flushT = setTimeout(flush, 500); return; }
  flushing = true;
  const ids = [...dirty]; dirty.clear();
  let idx = 0;
  try {
    for (; idx < ids.length; idx++) {
      const id = ids[idx];
      if (id === 'core') await dbc.doc('core').set(clone(D));
      else await dbc.doc(id).set({items: clone(M[id.slice(2)] || [])});
    }
    if (ui.sync === 'error') ui.sync = 'cloud';
  } catch(e) { ids.slice(idx).forEach(i => dirty.add(i)); ui.sync = 'error'; }

}
async function initCloud(){
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const col = db.collection('data/users/' + id);
    const snap = await Promise.race([col.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    const docs = {}; snap.docs.forEach(d => docs[d.id] = d.data());
    dbc = col;
    const remote = docs.core;
    if (remote && (remote.updated || 0) > (D.updated || 0)) {
      D = migrate(clone(remote)); M = {};
      Object.keys(docs).forEach(k => { if (k.startsWith('m-')) M[k.slice(2)] = clone(docs[k].items || []); });
      persistLocal();
    } else if (D.updated > 0) {
      dirty.add('core'); Object.keys(M).forEach(k => dirty.add('m-' + k));
      clearTimeout(flushT); flushT = setTimeout(flush, 300);

/* ---------- 4 Berechnung ---------- */
const mkey = d => d.slice(0,7);
const entriesOn = d => (M[mkey(d)] || []).filter(e => e.d === d);
const allEntries = () => Object.values(M).flat();
const sumT = list => list.reduce((a,e) => ({k:a.k+e.t.k, p:a.p+e.t.p, c:a.c+e.t.c, f:a.f+e.t.f}), {k:0,p:0,c:0,f:0});
const dayT = d => sumT(entriesOn(d));
const scale = (per, g) => ({k:R1(per.k*g/100), p:R1(per.p*g/100), c:R1(per.c*g/100), f:R1(per.f*g/100)});
const macroKcal = t => 4*t.p + 4*t.c + 9*t.f;
function findEntry(id){
  for (const k of Object.keys(M)) { const i = M[k].findIndex(e => e.id === id); if (i >= 0) return {k, i, e:M[k][i]}; }
  return null;
}
function makeEntry(o, meal, date){
  const e = {id:uid(), d:date, m:meal, n:o.n, g:o.g ?? null, per100:o.per100 || null,
    t:(o.per100 && o.g != null) ? scale(o.per100, o.g) : clone(o.t), src:o.src || 'manual', ts:Date.now()};
  if (o.conf) e.conf = o.conf; if (o.note) e.note = o.note; if (o.grp) e.grp = o.grp; if (o.demo) e.demo = true;
  return e;
}
function addEntries(list){
  const months = new Set();
  list.forEach(e => { const k = mkey(e.d); (M[k] = M[k] || []).push(e); months.add(k); });
  months.forEach(k => touch(k));
}
function deleteEntry(id){ const f = findEntry(id); if (!f) return; M[f.k].splice(f.i,1); touch(f.k); }
function lastNDays(n, end){ const out = []; for (let i=n-1;i>=0;i--) out.push(addDays(end,-i)); return out; }
function customFoodsAsFoods(){ return D.customFoods.map(c => ({id:'c:'+c.id, n:c.n, per100:c.per100, portion:c.pn ? {name:c.pn,g:c.pg} : null, src:'custom'})); }
function recentFoods(){
  const since = addDays(todayStr(), -90), map = {};
  allEntries().forEach(e => {
    if (!e.per100 || e.d < since) return;
    const key = norm(e.n);
    const r = map[key] || (map[key] = {id:'r:'+key, n:e.n, per100:e.per100, lastG:e.g, count:0, ts:0, src:'recent', portion:null});
    r.count++; if (e.ts >= r.ts) { r.ts = e.ts; r.lastG = e.g; r.per100 = e.per100; }
  });
  return Object.values(map);
}
function foodById(id){
  if (id.startsWith('r:')) return recentFoods().find(f => f.id === id);
  if (id.startsWith('c:')) return customFoodsAsFoods().find(f => f.id === id);
  return FOODS.find(f => f.id === id);
}
function searchFoods(q){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return null;
  const pool = [...customFoodsAsFoods(), ...FOODS];
  const hits = pool.filter(f => { const n = norm(f.n); return toks.every(t => n.includes(t)); });
  hits.sort((a,b) => (norm(b.n).startsWith(toks[0]) - norm(a.n).startsWith(toks[0])) || a.n.length - b.n.length);
  return hits.slice(0,40);
}
function bmr(S){ return 10*S.weight + 6.25*S.height - 5*S.age + (S.sex === 'w' ? -161 : 5); }
const ACT = {0:1.2,1:1.35,2:1.35,3:1.45,4:1.55,5:1.65,6:1.75,7:1.75};

/* ---------- 5 Diagramme (reines SVG) ---------- */
function roundedBar(x, y, w, h, r){
  r = Math.min(r, w/2, h);
  return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`;
}
function barChart({vals, labels, goal, color, id, sel, act='selBar', dates}){
  const W=340, H=168, pl=6, pr=6, pt=16, pb=22, n=vals.length;
  const iw=W-pl-pr, ih=H-pt-pb, bw=iw/n, barW=Math.max(3, bw*(n>14 ? .7 : .56));
  const max = Math.max(goal*1.18, ...vals, 1);
  const step = n > 14 ? 5 : 1;
  let out = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm">`;
  out += `<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/>`;
  const gy = pt + ih - goal/max*ih;
  out += `<line class="goal" x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}"/><text x="${W-pr}" y="${gy-4}" text-anchor="end">Ziel ${f0(goal)}</text>`;
  vals.forEach((v,i) => {
    const x = pl + i*bw + (bw-barW)/2, h = v/max*ih;
    const dim = (sel != null && sel !== i) ? .4 : 1;
    if (v > 0) out += `<path d="${roundedBar(x, pt+ih-h, barW, h, 4)}" fill="${color}" opacity="${dim}"/>`;
    else out += `<rect x="${x}" y="${pt+ih-2}" width="${barW}" height="2" rx="1" fill="var(--ink3)" opacity=".35"/>`;
    if (i % step === 0 || i === n-1 && n <= 14) out += `<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`;
    out += `<rect x="${pl+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-act="${act}" data-chart="${id}" data-i="${i}" ${dates?`data-d="${dates[i]}"`:''}/>`;
  });
  return out + '</svg>';
}
function lineChart(points, sel){
  const W=340, H=170, pl=30, pr=12, pt=14, pb=24, iw=W-pl-pr, ih=H-pt-pb;
  if (!points.length) return '';
  const ts = points.map(p => parseD(p.d).getTime()), t0 = Math.min(...ts), t1 = Math.max(...ts);
  const ks = points.map(p => p.kg), lo = Math.min(...ks) - .6, hi = Math.max(...ks) + .6;
  const X = t => points.length === 1 || t1 === t0 ? pl + iw/2 : pl + (t - t0)/(t1 - t0)*iw;
  const Y = k => pt + ih - (k - lo)/(hi - lo)*ih;
  let out = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">`;
  out += `<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/>`;
  out += `<text x="${pl-5}" y="${Y(hi)+4}" text-anchor="end">${f1(hi)}</text><text x="${pl-5}" y="${Y(lo)}" text-anchor="end">${f1(lo)}</text>`;
  const pts = points.map((p,i) => `${X(ts[i]).toFixed(1)},${Y(p.kg).toFixed(1)}`);
  if (points.length > 1) out += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  points.forEach((p,i) => {
    const [x,y] = pts[i].split(',');
    const big = sel === i;
    out += `<circle cx="${x}" cy="${y}" r="${big?6:4}" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>`;
    out += `<circle cx="${x}" cy="${y}" r="16" fill="transparent" data-act="selW" data-i="${i}"/>`;
  });
  out += `<text x="${pl}" y="${H-6}" text-anchor="start">${dLabel(points[0].d).split(', ')[1]}</text>`;
  if (points.length > 1) out += `<text x="${W-pr}" y="${H-6}" text-anchor="end">${dLabel(points[points.length-1].d).split(', ')[1]}</text>`;
  return out + '</svg>';
}

      h += D.customFoods.length ? D.customFoods.map(c => `<div class="row"><button class="r-main" data-act="pickFood" data-id="c:${c.id}" data-mode="log"><div class="r-name">${esc(c.n)}</div><div class="r-sub">P ${f1(c.per100.p)} · KH ${f1(c.per100.c)} · F ${f1(c.per100.f)} pro 100 g</div></button>
        <div class="r-k">${f0(c.per100.k)}<small>kcal/100 g</small></div><button class="x" data-act="editCustom" data-id="${c.id}" aria-label="Bearbeiten">✎</button></div>`).join('')
        : '<div class="empty">Noch keine eigenen Lebensmittel. Lege z. B. dein Protein-Müsli oder ein Produkt vom Etikett an.</div>';
      h += '</div>';
    } else {
      h += `<div class="card">`;
      h += D.favorites.length ? D.favorites.map(f => { const t = sumT(f.items.map(i => ({t:i.per100 ? scale(i.per100,i.g) : i.t})));
        return `<button class="row" data-act="favOpen" data-id="${f.id}"><div class="r-main"><div class="r-name">${esc(f.n)}</div><div class="r-sub">${f.items.length} ${f.items.length===1?'Zutat':'Zutaten'} · P ${f0(t.p)} · KH ${f0(t.c)} · F ${f0(t.f)}</div></div><div class="r-k">${f0(t.k)}<small>kcal</small></div></button>`; }).join('')
        : '<div class="empty">Noch keine Favoriten. Öffne einen Eintrag auf „Heute“ und tippe auf „Als Favorit speichern“, oder speichere eine Foto-Analyse als Favorit.</div>';
      h += '</div>';
    }
  }
  return h + '</div>';
}

function viewPhoto(){
  const d = ui.draft || (ui.draft = {items:[], meal:ui.addMeal, status:'idle', photo:null, blob:null, hint:'', aiNote:'', err:'', fav:false, favName:''});
  let h = '';
  const aiOk = ui.ai === true;
  if (ui.ai === null) h += `<div class="note"><span class="spin"></span>&nbsp; KI-Funktion wird geprüft …</div>`;
  else if (!aiOk) h += `<div class="note warn"><b>KI-Foto-Analyse hier nicht verfügbar.</b> Du kannst das Foto als Gedächtnisstütze wählen und die Zutaten manuell hinzufügen. Es werden keine Ergebnisse simuliert.</div>`;
  else h += `<div class="note">Die Analyse nutzt dein eigenes Claude-Kontingent. Beim ersten Mal fragt Claude um Erlaubnis. Ergebnisse sind <b>Schätzungen</b> – prüfe Portionen und Zutaten.</div>`;
  if (d.photo) h += `<img class="photo" src="${d.photo}" alt="Foto der Mahlzeit">`;
  h += `<label class="pick" style="${d.photo?'padding:14px;margin-bottom:12px':''}">${d.photo ? '<b style="font-size:16px">Anderes Foto wählen</b>' : ICON.scan.replace('<svg','<svg').replace('viewBox','viewBox') + '<b>Foto aufnehmen oder auswählen</b><span class="small">Kamera oder Fotomediathek</span>'}
    <input id="photoIn" type="file" accept="image/*" style="display:none" data-in="photo"></label>`;
  if (d.photo && aiOk) {
    h += `<label class="lab">Hinweis für die KI (optional)</label><input class="inp" id="hintIn" data-in="hint" value="${esc(d.hint)}" placeholder="z. B. Vollkornreis, mit 1 EL Öl gebraten">`;
    h += d.status === 'busy'
      ? `<div class="row2" style="margin:12px 0"><span class="spin"></span><span class="muted">Claude analysiert dein Essen …</span><span class="sp"></span><button class="btn sec sm" data-act="stopAI">Abbrechen</button></div>`
      : `<button class="btn" style="margin:12px 0" data-act="analyze">${d.items.length ? 'Neu analysieren' : 'Mit KI analysieren'}</button>`;
  }
  if (d.err) h += `<div class="note warn">${esc(d.err)}</div>`;
  if (d.aiNote) h += `<div class="note"><b>Einschätzung:</b> ${esc(d.aiNote)}</div>`;
  if (d.items.length || d.photo || d.status === 'done') {
    const T = sumT(d.items.map(i => ({t:scale(i.per100,i.g)})));
    h += d.items.map(draftItemHTML).join('');
    h += `<button class="btn sec" data-act="dAdd" style="margin:4px 0 12px">+ Zutat manuell hinzufügen</button>`;
    if (d.items.length) {
      h += `<div class="card"><h2>Summe der Mahlzeit</h2><div class="num" style="font-size:34px;font-weight:750">${f0(T.k)} <span class="muted" style="font-size:16px;font-weight:500">kcal</span></div>
        <div class="mpills"><div><b style="color:var(--prot)">${f0(T.p)} g</b>Protein</div><div><b style="color:var(--carb)">${f0(T.c)} g</b>Kohlenhydr.</div><div><b style="color:var(--fat)">${f0(T.f)} g</b>Fett</div></div>
        <label class="lab">Speichern unter</label>${seg(MEALS.map(m=>[m.id, m.n==='Mittagessen'?'Mittag':m.n==='Abendessen'?'Abend':m.n]), d.meal, 'dMeal')}
        <div class="small muted" style="margin-bottom:10px">Datum: ${dLabel(ui.date)}</div>
        <label class="row2" style="margin-bottom:10px"><input type="checkbox" data-in="favChk" ${d.fav?'checked':''} style="width:20px;height:20px;accent-color:var(--acc)"><span>Zusätzlich als Favorit speichern</span></label>
        ${d.fav ? `<input class="inp" data-in="favName" value="${esc(d.favName||d.items.map(i=>i.n)[0])}" placeholder="Name des Favoriten" style="margin-bottom:10px">` : ''}
        <button class="btn" data-act="saveDraft">Mahlzeit speichern</button></div>`;
    }
    h += `<button class="btn danger" data-act="clearDraft">Verwerfen</button>`;
  }
  return h;
}
function draftItemHTML(i){
  const t = scale(i.per100, i.g);
  const conf = i.conf ? `<span class="pill ${i.conf==='hoch'?'ok':i.conf==='niedrig'?'warn':''}">Sicherheit: ${esc(i.conf)}</span>` : '';
  return `<div class="item"><div class="hd"><b>${esc(i.n)}${i.src==='ai'?'<span class="tag">KI</span>':''}</b>
      <span class="num" style="font-weight:700">${f0(t.k)} kcal</span><button class="x" data-act="dEdit" data-id="${i.id}" aria-label="Bearbeiten">✎</button></div>
    <div class="small muted" style="margin-top:3px">P ${f0(t.p)} · KH ${f0(t.c)} · F ${f0(t.f)} · ${f0(i.per100.k)} kcal/100 g</div>
    ${i.note ? `<div class="small faint" style="margin-top:6px">Annahme: ${esc(i.note)}</div>` : ''}
    <div class="irow"><div class="stepper"><button class="ib" data-act="dStep" data-id="${i.id}" data-d="-10">−</button>
      <input class="inp" inputmode="decimal" value="${f0(i.g)}" data-in="dGram" data-id="${i.id}" aria-label="Gramm"><span class="muted">g</span>
      <button class="ib" data-act="dStep" data-id="${i.id}" data-d="10">+</button></div><span class="sp"></span>${conf}
      <button class="x" data-act="dDel" data-id="${i.id}" aria-label="Entfernen">✕</button></div></div>`;
}

function viewHist(){
  const S = D.settings, today = todayStr(), n = ui.range, days = lastNDays(n, today);
  const tk = days.map(d => dayT(d)), kc = tk.map(t => Math.round(t.k)), pr = tk.map(t => Math.round(t.p));
  const labels = days.map(d => n <= 7 ? WD[parseD(d).getDay()] : String(parseD(d).getDate()));
  const logged = days.filter((d,i) => kc[i] > 0), nl = logged.length;
  const avgK = nl ? kc.reduce((a,b)=>a+b,0)/nl : 0, avgP = nl ? pr.reduce((a,b)=>a+b,0)/nl : 0;
  const hitK = kc.filter(v => v > 0 && Math.abs(v - S.kcal) <= S.kcal*.1).length;
  const hitP = pr.filter(v => v >= S.p*.95).length;
  const selK = ui.sel.kcal, selP = ui.sel.prot;
  const ro = (i, arr, unit, goal) => i == null ? 'Tippe auf einen Balken für Details' : `${dLabel(days[i])} · <span class="num">${f0(arr[i])} ${unit}</span> · ${goal>0?f0(arr[i]/goal*100):0} % vom Ziel`;
  const ws = [...D.weights].sort((a,b)=>a.d.localeCompare(b.d)), wsince = addDays(today,-90), wr = ws.filter(w => w.d >= wsince);
  const sw = ui.sel.w, pw = sw != null && wr[sw] ? wr[sw] : null;
  const dChg = wr.length > 1 ? wr[wr.length-1].kg - wr[0].kg : null;
  let h = `<div class="fade"><h1>Verlauf</h1>${seg([[7,'7 Tage'],[30,'30 Tage']], ui.range, 'range')}
  <div class="card"><h2>Kalorien pro Tag</h2><div class="readout">${ro(selK, kc, 'kcal', S.kcal)}</div>
    ${barChart({vals:kc, labels, goal:S.kcal, color:'var(--acc)', id:'kcal', sel:selK})}
    <div class="stats"><div><b>${nl?f0(avgK):'–'}</b><span>Ø kcal pro erfasstem Tag</span></div><div><b>${hitK} / ${n}</b><span>Tage im Zielbereich (±10 %)</span></div></div></div>
  <div class="card"><h2>Protein pro Tag</h2><div class="readout">${ro(selP, pr, 'g', S.p)}</div>
    ${barChart({vals:pr, labels, goal:S.p, color:'var(--prot)', id:'prot', sel:selP})}
    <div class="stats"><div><b>${nl?f0(avgP):'–'} g</b><span>Ø Protein pro erfasstem Tag</span></div><div><b>${hitP} / ${n}</b><span>Tage mit ≥ 95 % des Ziels</span></div></div></div>
  <div class="card"><div class="row2"><h2 style="margin:0">Körpergewicht</h2><span class="sp"></span><button class="btn sm" data-act="newWeight">+ Eintrag</button></div>
    <div class="readout" style="margin-top:10px">${pw ? `${dLabel(pw.d)} · <span class="num">${f1(pw.kg)} kg</span>` : wr.length ? 'Tippe auf einen Punkt für Details' : ''}</div>
    ${wr.length ? lineChart(wr, sw) : '<div class="empty">Noch kein Gewicht eingetragen.</div>'}
    ${dChg != null ? `<div class="small muted" style="margin-top:6px">Veränderung (letzte 90 Tage): <b style="color:var(--ink)">${dChg>0?'+':''}${f1(dChg)} kg</b></div>` : ''}
    <div style="margin-top:8px">${[...ws].reverse().slice(0,8).map(w => `<div class="row"><div class="r-main"><div class="r-name">${f1(w.kg)} kg${w.demo?'<span class="tag warn">Demo</span>':''}</div><div class="r-sub">${dLabel(w.d)}</div></div><button class="x" data-act="delWeight" data-id="${w.id}" aria-label="Löschen">✕</button></div>`).join('')}</div></div>
  <div class="card"><h2>Tage im Überblick</h2>`;
  const rows = days.map((d,i) => ({d, t:tk[i]})).filter(r => r.t.k > 0).reverse();
  h += rows.length ? rows.map(r => `<button class="row" data-act="goDay" data-d="${r.d}"><div class="r-main"><div class="r-name">${dLabel(r.d)}</div><div class="r-sub">P ${f0(r.t.p)} · KH ${f0(r.t.c)} · F ${f0(r.t.f)}</div></div><div class="r-k">${f0(r.t.k)}<small>kcal</small></div></button>`).join('') : '<div class="empty">Keine Einträge in diesem Zeitraum.</div>';
  return h + '</div></div>';
}

function bodyBox(){
  const S = D.settings, b = bmr(S), f = ACT[clamp(Math.round(S.days),0,7)] || 1.45, tdee = b*f;
  const diff = S.kcal - tdee;
  return `<b>Grundumsatz (Mifflin-St-Jeor)</b><br>10 × ${f1(S.weight)} + 6,25 × ${f0(S.height)} − 5 × ${f0(S.age)} ${S.sex==='w'?'− 161':'+ 5'} = <b>${f0(b)} kcal</b><br>
    <b>Gesamtumsatz</b>: ${f0(b)} × ${String(f).replace('.',',')} (${S.days}× Training/Woche) = <b>${f0(tdee)} kcal</b><br>
    Dein Ziel liegt ${diff>=0?'+':'−'}${f0(Math.abs(diff))} kcal ${diff>=0?'über':'unter'} diesem Richtwert · Protein: ${f1(S.p/S.weight)} g pro kg Körpergewicht.`;
}
function macroSum(){
  const S = D.settings, k = macroKcal({p:S.p,c:S.c,f:S.f}), diff = k - S.kcal;
  return `Makros ergeben ${f0(S.p)} × 4 + ${f0(S.c)} × 4 + ${f0(S.f)} × 9 = <b>${f0(k)} kcal</b> ${Math.abs(diff) <= 25 ? '(passt zum Kalorienziel)' : `(${diff>0?'+':'−'}${f0(Math.abs(diff))} kcal zum Kalorienziel)`}`;
}
function viewProfile(){
  const S = D.settings;
  const syncTxt = ui.sync === 'cloud' ? '<span class="pill ok">Dauerhaft gespeichert (dein Konto)</span>' : ui.sync === 'error' ? '<span class="pill warn">Cloud-Speicherung fehlgeschlagen · lokal gesichert</span>' : '<span class="pill warn">Nur auf diesem Gerät gespeichert</span>';
  const numIn = (k, lab, unit, step='1') => `<div><label class="lab">${lab}</label><div class="row2"><input class="inp" type="number" inputmode="decimal" step="${step}" value="${S[k]}" data-in="setting" data-k="${k}"><span class="muted small">${unit}</span></div></div>`;
  const hasDemo = allEntries().some(e => e.demo) || D.weights.some(w => w.demo);
  return `<div class="fade"><h1>Profil</h1>
  <div class="card"><h2>Tagesziele</h2><div class="grid2">${numIn('kcal','Kalorien','kcal','50')}${numIn('p','Protein','g')}${numIn('c','Kohlenhydrate','g')}${numIn('f','Fett','g')}${numIn('water','Wasser','ml','250')}</div>
    <div class="note" id="macroSum" style="margin-top:12px">${macroSum()}</div></div>
  <div class="card"><h2>Körperdaten & Richtwert</h2><div class="grid2">${numIn('age','Alter','Jahre')}${numIn('height','Größe','cm')}${numIn('weight','Gewicht','kg','0.1')}${numIn('days','Training','× pro Woche')}</div>
    <label class="lab">Geschlecht (nur für die Formel)</label>${seg([['m','Männlich'],['w','Weiblich']], S.sex, 'sex')}
    <div class="note" id="bodyBox">${bodyBox()}</div>
    <button class="btn sec" data-act="applyKcal">Richtwert als Kalorienziel übernehmen</button></div>
  ${cookCard()}
  ${kitchenCard()}
  <div class="card"><h2>Darstellung</h2>${seg([['dark','Dunkel'],['light','Hell'],['system','System']], S.theme, 'theme')}</div>
  <div class="card"><h2>Daten</h2><div style="margin-bottom:12px">${syncTxt}</div>
    <div class="grid2"><button class="btn sec" data-act="export">Export (JSON)</button><button class="btn sec" data-act="importSheet">Import</button></div>
    <div class="grid2" style="margin-top:10px">${hasDemo ? '<button class="btn sec" data-act="demoOff">Demo-Daten entfernen</button>' : '<button class="btn sec" data-act="demoOn">Demo-Daten laden</button>'}<button class="btn danger" data-act="wipe">Alles löschen</button></div>
    <div class="small faint" style="margin-top:10px">Demo-Daten sind Beispielwerte (nicht deine) und mit „Demo“ markiert. Sie dienen nur dazu, Diagramme anzusehen.</div></div>
  <div class="card small muted"><b style="color:var(--ink)">Hinweise</b><br>Nährwerte der Datenbank sind Richtwerte pro 100 g (typische Durchschnittswerte). KI-Schätzungen aus Fotos können deutlich abweichen, vor allem bei Soßen, Ölen und Portionsgrößen. NutriSnap ersetzt keine medizinische oder ernährungsberatende Betreuung.</div></div>`;
}

/* ---------- Rendering ---------- */
function render(anim=false){
  ANIM = anim;
  const v = $('#view');
  v.innerHTML = ui.tab === 'taste' ? viewTaste() : ui.tab === 'disc' ? viewDisc() : ui.tab === 'week' ? viewWeek() : ui.tab === 'cart' ? viewCart() : ui.tab === 'recipes' ? viewRecipes() : isTrk() ? trackerNav() + (ui.tab === 'today' ? viewToday() : ui.tab === 'scan' ? viewScan() : viewHist()) : viewProfile();
  renderTabbar();
  if (anim) requestAnimationFrame(() => requestAnimationFrame(() => {
    v.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
    v.querySelectorAll('[data-off]').forEach(el => el.style.strokeDashoffset = el.dataset.off);
  }));
}
function go(tab, opts={}){ if (tab === 'disc') ui.kr = null; ui.tab = tab; $('#main').scrollTop = 0; render(true); }
function applyTheme(){
  const t = D.settings.theme;
  const th = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  document.documentElement.dataset.theme = th;
}

/* ---------- 7 Sheets ---------- */
function openSheet(s){ sh = s; renderSheet(); }
function closeSheet(){ sh = null; $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }
function calcBox(per, g){
  const t = scale(per, g);
  return `<div class="k">${f0(t.k)} <span class="muted" style="font-size:16px;font-weight:500">kcal</span></div>
    <div class="mpills"><div><b style="color:var(--prot)">${f1(t.p)} g</b>Protein</div><div><b style="color:var(--carb)">${f1(t.c)} g</b>Kohlenhydr.</div><div><b style="color:var(--fat)">${f1(t.f)} g</b>Fett</div></div>
    <div class="formula">${f1(g)} g × ${f1(per.k)} kcal ÷ 100 g = ${f1(t.k)} kcal</div>`;
}
function gramBlock(){
  const food = sh.food || {};
  const chips = [];
  if (food.portion) chips.push([food.portion.g, `1 ${food.portion.name} (${food.portion.g} g)`]);
  [50,100,150,200].forEach(g => chips.push([g, g + ' g']));
  return `<div class="stepper"><button class="ib" data-act="gStep" data-d="-10">−</button><input class="inp" id="gIn" inputmode="decimal" value="${f1(sh.g)}" data-in="sg" aria-label="Gramm"><span class="muted">g</span><button class="ib" data-act="gStep" data-d="10">+</button></div>
    <div class="chips">${chips.map(([g,l]) => `<button class="chip" data-act="gChip" data-g="${g}">${esc(l)}</button>`).join('')}</div>`;
}
const fld = (k, lab, val, extra='') => `<div><label class="lab">${lab}</label><input class="inp" ${extra} inputmode="decimal" value="${esc(val)}" data-in="sf" data-k="${k}"></div>`;
function renderSheet(){
  if (!sh) return;
  const el = $('#sheet'); let b = '', title = '';
  switch (sh.type) {
    case 'pick':
      title = sh.mode === 'draft' ? 'Zutat hinzufügen' : mealName(ui.addMeal) + ' hinzufügen';

      if (sh.mode === 'log') b += `<div class="grid2" style="margin-top:12px"><button class="btn sec" data-act="sheetScan">Foto scannen</button><button class="btn sec" data-act="sheetFavs">Favoriten</button></div><button class="btn sec" style="margin-top:10px" data-act="quick">Schnelleintrag</button>`;
      break;
    case 'portion':
      title = sh.food.n;
      b = gramBlock() + `<div class="cbox" id="calc">${calcBox(sh.food.per100, sh.g)}</div>`
        + (sh.mode === 'log' ? `${mealSelector()}<div class="small muted" style="margin:-4px 0 12px">Datum: ${dLabel(ui.date)}</div>` : '')
        + `<button class="btn" data-act="portionOk">${sh.mode === 'log' ? 'Hinzufügen' : 'Zur Mahlzeit hinzufügen'}</button>`;
      break;
    case 'entry': {

      if (sh.per100) {

          <details><summary>Nährwerte pro 100 g anpassen</summary><div class="grid4">${fld('pk','kcal',sh.per100.k)}${fld('pp','Protein',sh.per100.p)}${fld('pc','Kohlenh.',sh.per100.c)}${fld('pf','Fett',sh.per100.f)}</div></details>`;
      } else {
        b += `<div class="grid4">${fld('tk','kcal',sh.t.k)}${fld('tp','Protein',sh.t.p)}${fld('tc','Kohlenh.',sh.t.c)}${fld('tf','Fett',sh.t.f)}</div><div class="note" id="hint" style="margin-top:12px">${hintKcal(sh.t)}</div>`;
      }
      if (sh.note) b += `<div class="small faint" style="margin:8px 0">Annahme der KI: ${esc(sh.note)}</div>`;
      b += `<label class="lab" style="margin-top:12px">Mahlzeit</label>${seg(MEALS.map(m=>[m.id, m.n==='Mittagessen'?'Mittag':m.n==='Abendessen'?'Abend':m.n]), sh.meal, 'sheetMeal')}
        <input class="inp" type="date" value="${sh.date}" data-in="sf" data-k="date" style="margin-bottom:12px">
        <button class="btn" data-act="entryOk">Speichern</button>
        <div class="grid2" style="margin-top:10px"><button class="btn sec" data-act="entryFav">Als Favorit speichern</button><button class="btn danger" data-act="entryDel">Löschen</button></div>`;
      break; }
    case 'quick':
      title = 'Schnelleintrag';
      b = `<div class="small muted">Für Essen ohne Gramm-Angabe, z. B. aus dem Restaurant oder von der Verpackung.</div>
        <label class="lab">Name</label><input class="inp" data-in="sf" data-k="n" value="${esc(sh.n)}" placeholder="z. B. Döner">
        <div class="grid4" style="margin-top:6px">${fld('tk','kcal',sh.t.k||'')}${fld('tp','Protein',sh.t.p||'')}${fld('tc','Kohlenh.',sh.t.c||'')}${fld('tf','Fett',sh.t.f||'')}</div>
        <div class="note" id="hint" style="margin-top:12px">${hintKcal(sh.t)}</div>${mealSelector()}<button class="btn" data-act="quickOk">Hinzufügen</button>`;
      break;
    case 'custom':
      title = sh.id ? 'Lebensmittel bearbeiten' : 'Neues Lebensmittel';
      b = `<label class="lab">Name</label><input class="inp" data-in="sf" data-k="n" value="${esc(sh.n)}" placeholder="z. B. Protein-Müsli">
        <label class="lab">Nährwerte pro 100 g (laut Etikett)</label><div class="grid4">${fld('pk','kcal',sh.per100.k||'')}${fld('pp','Protein',sh.per100.p||'')}${fld('pc','Kohlenh.',sh.per100.c||'')}${fld('pf','Fett',sh.per100.f||'')}</div>

function hintKcal(t){
  const mk = macroKcal(t);
  if (!t.k && !mk) return 'Gib Kalorien und Makros ein.';
  const diff = mk - t.k;
  return `Aus Makros berechnet: ${f0(mk)} kcal${t.k && Math.abs(diff) > Math.max(25, t.k*.15) ? ` – weicht ${f0(Math.abs(diff))} kcal von deiner Angabe ab. Bitte prüfen.` : '.'}`;
}

let aiFn = null;
async function initAI(){
  try {
    if (!window.claude || !claude.use) { ui.ai = false; return; }
    const s = await claude.use('sample');
    if (!s) { ui.ai = false; return; }
    const lim = await s.limits().catch(() => null);
    aiFn = s; ui.aiText = true; ui.ai = !!(lim && lim.images);
  } catch(e) { ui.ai = false; }
  if (ui.tab === 'scan' || ui.tab === 'recipes' || ui.tab === 'disc') render();
}
async function downscale(file, max=1280){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return blob || file;
  } catch(e) { return file; }
  finally { URL.revokeObjectURL(url); }
}
const AI_PROMPT = hint => `Du bist ein erfahrener Ernährungsberater und analysierst das beigefügte Foto einer Mahlzeit.
Antworte AUSSCHLIESSLICH mit einem JSON-Objekt in genau diesem Format:
{"erkannt":true,"hinweis":"1-2 Sätze: Gesamteindruck, wichtigste Unsicherheiten","items":[{"name":"deutscher Name","gramm":150,"kcal_pro_100g":165,"protein_pro_100g":31,"kohlenhydrate_pro_100g":0,"fett_pro_100g":3.6,"sicherheit":"hoch|mittel|niedrig","annahme":"z. B. Annahme zu Portionsgröße, Zubereitung, Öl, Soße"}]}
Regeln:
- Liste jedes sichtbare Lebensmittel einzeln auf (Beilagen, Soßen, Öl/Dressing, Getränke, wenn erkennbar).
- Schätze die Portionsgröße in Gramm anhand von Tellergröße, Besteck und anderen Größenreferenzen. Nenne diese Annahme.
- Gib die Nährwerte pro 100 g für die zubereitete Form an (typische Werte nach USDA/BLS). Kalorien müssen zu den Makros passen (4 kcal/g Protein und Kohlenhydrate, 9 kcal/g Fett).
- Erfinde keine Marken oder unsichtbaren Zutaten. Wenn du bei einem Punkt unsicher bist, setze "sicherheit" auf "niedrig" und erkläre es unter "annahme".
- Ist kein Essen erkennbar, antworte {"erkannt":false,"hinweis":"Grund","items":[]}.
${hint ? 'Zusatzinfo des Nutzers (hat Vorrang vor deinen Vermutungen): ' + hint : ''}`;
async function analyze(){
  const d = ui.draft; if (!d || !d.blob || d.status === 'busy' || !aiFn) return;
  d.status = 'busy'; d.err = ''; ui.ctl = new AbortController(); render();
  try {
    const res = await aiFn.json(AI_PROMPT(d.hint), {images:[d.blob], signal:ui.ctl.signal, modelTier:'default'});
    const items = (Array.isArray(res && res.items) ? res.items : []).map(x => {
      let g = clamp(num(x.gramm), 1, 3000);
      const per = {k:Math.max(0,num(x.kcal_pro_100g)), p:Math.max(0,num(x.protein_pro_100g)), c:Math.max(0,num(x.kohlenhydrate_pro_100g)), f:Math.max(0,num(x.fett_pro_100g))};
      let note = String(x.annahme || '');
      const mk = macroKcal(per);
      if (Math.abs(per.k - mk) > Math.max(30, mk*.25)) { per.k = Math.round(mk); note += (note ? ' · ' : '') + 'kcal aus Makros neu berechnet (KI-Angabe war inkonsistent)'; }
      const conf = ['hoch','mittel','niedrig'].includes(x.sicherheit) ? x.sicherheit : 'mittel';
      return {id:uid(), n:String(x.name || 'Unbekannt').slice(0,60), g:Math.round(g), per100:per, conf, note, src:'ai'};
    }).filter(i => i.n);
    d.items = items; d.aiNote = res && res.hinweis ? String(res.hinweis) : '';
    d.status = 'done';
    if (!items.length) d.err = (res && res.erkannt === false) ? 'Auf dem Foto wurde kein Essen erkannt. ' + d.aiNote : 'Keine Lebensmittel erkannt. Füge Zutaten manuell hinzu.';
  } catch(e) {
    d.status = 'idle';
    const c = e && e.code;
    if (c !== 'cancelled') d.err = c === 'not_granted' ? 'Die KI-Nutzung wurde nicht erlaubt. Du kannst Zutaten manuell hinzufügen.' : c === 'rate_limited' ? 'Zu viele Anfragen oder dein Kontingent ist erreicht. Versuche es später erneut.' : c === 'image_rejected' ? 'Das Bild konnte nicht verarbeitet werden. Wähle ein anderes Foto.' : 'Die Analyse ist fehlgeschlagen. Versuche es erneut oder füge Zutaten manuell hinzu.';
  }
  ui.ctl = null; render();
}

/* ---- Allergene (aus Zutatennamen, deterministisch – keine KI-Entscheidung) ---- */
const ALG = {gluten:'Gluten', laktose:'Laktose / Milch', ei:'Ei', nuss:'Nüsse / Erdnüsse', fisch:'Fisch', krebs:'Krebstiere', soja:'Soja'};
const ALG_RX = {
  gluten:/haferflock|nudel|spaghetti|brot|toast|broetchen|wrap|mehl|muesli|couscous|cornflakes|pizza|weizen|gerste|seitan/,
  laktose:/milch|quark|joghurt|skyr|kaese|gouda|mozzarella|parmesan|feta|huettenkaese|butter|sahne|whey|frischkaese/,
  ei:/huehnerei|eiklar|eigelb|(^|[^a-z])eier?([^a-z]|$)/,
  nuss:/mandel|nuss|nuesse|cashew|pistazie/,
  fisch:/lachs|thunfisch|kabeljau|fisch|forelle|sardine|seelachs/,
  krebs:/garnele|krabbe|shrimp|hummer/,
  soja:/tofu|soja|edamame/
};
function allergensOf(names){
  const out = new Set();
  names.forEach(n => {
    const s = norm(n).replace(/kokosmilch/g,'kokos').replace(/erdnussbutter/g,'erdnuss').replace(/haferdrink/g,'hafer');
    Object.keys(ALG_RX).forEach(k => { if (ALG_RX[k].test(s)) out.add(k); });
  });
  return out;
}
const MEAT_RX = /huehn|haehn|pute|rind|schwein|lachs|thunfisch|kabeljau|garnele|schinken|salami|bacon|hack|steak|fisch/;

/* ---- Einkaufs-Kategorien ---- */
const CAT_ORDER = ['Obst & Gemüse','Fleisch & Fisch','Milch, Eier & Kühlregal','Getreide & Backwaren','Konserven & Hülsenfrüchte','Nüsse, Öl & Süßes','Sonstiges'];
function catOf(n){
  const s = norm(n);
  if (/dose|mais|kichererbse|kidney|linsen|passierte|kokosmilch|sojasauce/.test(s)) return CAT_ORDER[4];
  if (/oel|nuss|nuesse|mandel|cashew|erdnuss|honig|zucker|nougat|marmelade|schokolade|chips|gummi|whey|protein|datteln/.test(s)) return CAT_ORDER[5];
  if (MEAT_RX.test(s)) return CAT_ORDER[1];
  if (/apfel|banane|orange|beere|trauben|avocado|tomate|gurke|paprika|brokkoli|karotte|spinat|salat|zwiebel|champignon|zucchini|knoblauch|zitrone|kartoffel|suess/.test(s)) return CAT_ORDER[0];
  if (/milch|quark|joghurt|skyr|kaese|gouda|mozzarella|parmesan|feta|huettenkaese|butter|ei|tofu|hummus/.test(s)) return CAT_ORDER[2];
  if (/haferflock|nudel|reis|brot|toast|broetchen|wrap|muesli|cornflakes|couscous|quinoa|mehl/.test(s)) return CAT_ORDER[3];
  return CAT_ORDER[6];
}
const LIQ_RX = /milch|saft|oel|drink|cola|kokosmilch|sojasauce|passierte/;
function amtLabel(n, g){
  g = Math.round(g * 10) / 10;
  const liquid = LIQ_RX.test(norm(n)) && !/quark|kaese/.test(norm(n));
  const base = g >= 1000 ? `${f1(g/1000)} ${liquid?'l':'kg'}` : `${g < 10 ? f1(g) : f0(g)} ${liquid?'ml':'g'}`;
  const food = foodByName(n);
  if (food && food.portion && /^(Stück|mittelgroß|Scheibe|Kugel|Zehe)$/.test(food.portion.name) && g >= food.portion.g*0.8 && food.portion.g > 5) {
    const c = Math.round(g / food.portion.g * 2) / 2;
    return `${base} (≈ ${String(c).replace('.',',')} ${food.portion.name === 'mittelgroß' ? 'Stk.' : food.portion.name === 'Stück' ? 'Stk.' : food.portion.name})`;
  }
  return base;
}
